name: Handbook source and preview safety regressions
on:
  pull_request:
    paths:
      - 'components/service-handbook.tsx'
      - 'lib/handbook/reader-content.ts'
      - 'data/handbook-content.json'
      - 'tests/reader-first-handbook.test.mjs'
      - 'tests/fixtures/reader-first-baseline-sha256.json'
      - 'docs/prototypes/**'
      - 'app/handbook-preview/**'
      - 'app/handbook-sources/**'
      - 'app/services/dayservice/page.tsx'
      - 'app/services/dayrehab/page.tsx'
      - 'tests/test_handbook_sources_public_pilot.py'
      - 'tests/test_handbook_evidence_bridges.py'
      - 'tests/test_dayservice_handbook*.py'
      - '.github/workflows/handbook-preview-regressions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handbook:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independently check reader conditions and original chapter preservation
        run: |
          python scripts/build_handbook_site.py --check
          node --experimental-strip-types --test tests/reader-first-handbook.test.mjs
      - name: Verify dayservice legacy regressions
        run: python -m unittest discover -s tests -p 'test_dayservice_handbook*.py' -v
      - name: Verify chapter evidence bridges
        run: python -m unittest discover -s tests -p 'test_handbook_evidence_bridges.py' -v
      - name: Verify bounded source-navigation public pilot
        run: python -m unittest discover -s tests -p 'test_handbook_sources_public_pilot.py' -v
      - name: Check both HTML inline scripts parse with Node
        run: |
          python - <<'PY'
          import pathlib,re,subprocess
          for basename in ('dayservice-handbook.html','dayrehab-evidence-handbook.html'):
              path=pathlib.Path('docs/prototypes')/basename
              html=path.read_text(encoding='utf-8')
              matches=re.findall(r'<script>([\s\S]*?)</script>',html)
              if len(matches)!=1: raise SystemExit(f'{path}: expected one runnable inline JS, got {len(matches)}')
              checked=subprocess.run(['node','--check','--input-type=commonjs'],input=matches[0],text=True,capture_output=True)
              if checked.returncode: raise SystemExit(f'{path}: {checked.stderr}')
              print(f'{path}: JavaScript syntax PASS')
          PY
