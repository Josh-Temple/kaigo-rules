name: Worker E integration regeneration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate-and-validate:
    if: startsWith(github.event.pull_request.title, '[Worker E]') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Regenerate canonical relation and publication artifacts
        run: |
          python scripts/build_residual_relation_independent_verification.py
          python scripts/build_relation_verification_queue.py
          python scripts/build_relation_human_review_packet.py
          python scripts/build_relation_human_review_evidence_pack.py
          python scripts/build_relation_human_review_pilot.py
          python scripts/build_relation_human_review_batches.py
          python scripts/build_relation_human_review_decision_effects.py
          python scripts/build_verification_registry.py
          python scripts/build_database_coverage_matrix.py
          python scripts/build_publication_requirement_scoping.py
          python scripts/build_publication_readiness.py
          python scripts/build_bounded_publication_allowlist.py
          python scripts/build_product_value_snapshot.py

      - name: Validate Worker A-D integration boundaries
        run: |
          python scripts/validate_governing_standards_residual_currentness_worker_a.py
          python scripts/validate_delegated_remuneration_currentness_worker_b.py
          python scripts/validate_residual_relation_independent_verification.py
          python -m unittest tests.test_multi_source_runtime_allowlist
          node --experimental-strip-types --test tests/next-source-runtime-relations.test.mjs

      - name: Full validation
        run: npm run validate:data

      - name: Production build
        run: npm run build

      - name: Commit regenerated canonical artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No regenerated artifact changes."
          else
            echo "Regenerated files:"
            git diff --cached --name-only
            git commit -m "[Worker E] Regenerate canonical artifacts after A-D integration"
            git push origin HEAD:integration/relation-assurance-next-source-publication-wave-e-20261006
          fi
