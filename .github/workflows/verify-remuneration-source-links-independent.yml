name: Verify remuneration source links independently

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/verify_remuneration_source_links_independent.py"
      - "data/remuneration-relations.json"
      - "data/sources.json"
      - ".github/workflows/verify-remuneration-source-links-independent.yml"
  push:
    branches: [main]
    paths:
      - "scripts/verify_remuneration_source_links_independent.py"
      - "data/remuneration-relations.json"
      - "data/sources.json"
      - ".github/workflows/verify-remuneration-source-links-independent.yml"
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Independently verify remuneration source links
        id: verify
        shell: bash
        run: |
          set +e
          python scripts/verify_remuneration_source_links_independent.py --report remuneration-source-link-independent-verification.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload independent source-link report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remuneration-source-link-independent-verification
          path: remuneration-source-link-independent-verification.json
          if-no-files-found: warn
      - name: Fail on source-link differences
        if: steps.verify.outputs.exit_code != '0'
        run: exit 1
