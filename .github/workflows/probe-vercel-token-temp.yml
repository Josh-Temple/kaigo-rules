name: Probe Vercel token availability

on:
  push:
    branches:
      - chore/vercel-token-probe-20260924

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check token presence without exposing it
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN_PRESENT=true"
          else
            echo "VERCEL_TOKEN_PRESENT=false"
          fi
