name: One-time Kaigo Ops production deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-kaigo-ops-production-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger Kaigo Ops production deploy
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_KAIGO_OPS }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Missing secret VERCEL_DEPLOY_HOOK_KAIGO_OPS"
            exit 1
          fi
          response="$(curl --fail-with-body --silent --show-error -X POST "$DEPLOY_HOOK")"
          echo "$response" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("job",{}).get("id"), d'
          echo "Kaigo Ops deploy hook accepted."

      - name: Verify production routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://ops-site-pi.vercel.app"
          for attempt in $(seq 1 40); do
            home="$(curl --silent --show-error --fail "$base/" || true)"
            route1="$(curl --silent --show-error --fail "$base/issues/information-search" || true)"
            route2="$(curl --silent --show-error --fail "$base/issues/documentation" || true)"
            route3="$(curl --silent --show-error --fail "$base/issues/training-handover" || true)"
            route4="$(curl --silent --show-error --fail "$base/issues/communication-collaboration" || true)"
            route5="$(curl --silent --show-error --fail "$base/issues/productivity-utilization" || true)"

            if printf '%s' "$home" | grep -q "稼働率・生産性を改善したい"               && printf '%s' "$route1" | grep -q "必要な情報を探すのに"               && printf '%s' "$route2" | grep -q "記録・文書作成に"               && printf '%s' "$route3" | grep -q "職員教育・引き継ぎが"               && printf '%s' "$route4" | grep -q "問い合わせ・連携の"               && printf '%s' "$route5" | grep -q "稼働率・生産性を"; then
              echo "Production verification passed."
              exit 0
            fi
            sleep 15
          done

          echo "::error::Production did not reflect all five Kaigo Ops issue routes within the verification window."
          exit 1
