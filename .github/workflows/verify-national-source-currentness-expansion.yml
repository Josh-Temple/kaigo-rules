name: Verify national source currentness expansion

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "data/verification/national-source-currentness-expansion.json"
      - "scripts/national_source_currentness_projection.py"
      - "scripts/validate_national_source_currentness_expansion.py"
      - "tests/test_national_source_currentness_expansion.py"
      - "data/verification/shared-currentness-assurance.json"
      - "data/care-insurance-act-meta.json"
      - "data/ordinance37-meta.json"
      - "data/shared/standards/**"
      - "data/qa-corpus-meta.json"
      - "data/shared/remuneration-delegated/**"
      - "data/shared/remuneration-notification/**"
      - "data/shared/fee-guidance/**"
      - "data/unit-price-item-body-assurance.json"
      - "data/shared/other-national-materials/**"
      - ".github/workflows/verify-national-source-currentness-expansion.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install independent HTML parser
        run: python -m pip install beautifulsoup4==4.13.4

      - name: Validate inherited shared currentness evidence
        run: python scripts/validate_shared_currentness_assurance.py

      - name: Show inherited safe projection summary
        run: python scripts/shared_currentness_projection.py --summary-only

      - name: Re-check live e-Gov current revisions
        run: python scripts/verify_egov_source_freshness.py

      - name: Re-check live shared standards current revisions
        run: python scripts/verify_shared_standards_source_freshness.py

      - name: Re-check live national Q&A compilation
        run: python scripts/verify_qa_source_freshness.py

      - name: Re-fetch delegated remuneration official bodies
        run: python scripts/verify_delegated_remuneration_item_body.py

      - name: Re-check day-service remuneration source independently
        run: python scripts/verify_remuneration_independent.py

      - name: Validate delegated remuneration assurance separation
        run: python scripts/validate_delegated_remuneration_item_body_assurance.py

      - name: Validate remuneration notification assurance separation
        run: python scripts/validate_remuneration_notification_assurance.py

      - name: Validate Fee Guidance comparison/current-body boundary
        run: python scripts/validate_shared_fee_guidance.py

      - name: Validate Worker C currentness evidence ledger
        run: python scripts/validate_national_source_currentness_expansion.py

      - name: Show Worker C read-only projection summary
        run: python scripts/national_source_currentness_projection.py --summary-only

      - name: Run Worker C currentness regression tests
        run: python -m unittest discover -s tests -p 'test_national_source_currentness_expansion.py'

      - name: Confirm global coverage artifacts remain unchanged
        run: python scripts/build_database_coverage_matrix.py --check

      - name: Reject Worker C edits to global generated artifacts
        if: github.event_name == 'pull_request' && github.head_ref != 'work/national-source-assurance-completion-integrator'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          for path in \
            data/database-coverage-matrix.generated.json \
            docs/database-coverage-summary.generated.md \
            data/services/catalog.generated.json
          do
            if printf '%s\n' "$changed" | grep -Fxq "$path"; then
              echo "Worker C must not edit global generated artifact: $path" >&2
              exit 1
            fi
          done
