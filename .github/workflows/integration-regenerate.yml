name: Integrator regenerate projections

on:
  push:
    branches:
      - "work/shared-family-expansion-wave-integrator"

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Regenerate canonical projections
        run: |
          python scripts/build_service_catalog.py
          python scripts/build_verification_registry.py
          python scripts/build_database_coverage_matrix.py
      - name: Commit regenerated artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/services/catalog.generated.json data/verification-registry.json data/database-coverage-matrix.generated.json docs/database-coverage-summary.generated.md
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Regenerate integrated coverage projections"
          git push origin HEAD:work/shared-family-expansion-wave-integrator
