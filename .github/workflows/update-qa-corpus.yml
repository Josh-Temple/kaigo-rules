name: Update MHLW Q&A corpus

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-qa-corpus.yml"
      - "scripts/import_mhlw_qa.py"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Excel readers
        run: python -m pip install openpyxl==3.1.5 xlrd==2.0.2

      - name: Import official MHLW Q&A corpus
        run: python scripts/import_mhlw_qa.py

      - name: Validate data references
        run: node scripts/validate-data.mjs

      - name: Detect changes
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- data/qa-corpus.json data/qa-corpus-meta.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push review branch
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          BRANCH="automation/qa-corpus-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add data/qa-corpus.json data/qa-corpus-meta.json
          git commit -m "data: refresh MHLW Q&A corpus"
          git push origin "$BRANCH"
          {
            echo "## Q&A corpus update ready for review"
            echo ""
            echo "Branch: `$BRANCH`"
            echo ""
            echo "Open a pull request from this branch after reviewing the generated metadata and counts."
          } >> "$GITHUB_STEP_SUMMARY"
