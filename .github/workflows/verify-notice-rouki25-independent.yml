name: Verify rouki25 day-service reconstruction independently

on:
  workflow_dispatch:
  schedule:
    - cron: "31 3 * * 1"
  pull_request:
    paths:
      - "scripts/verify_notice_rouki25_independent.py"
      - "scripts/import_notice_*"
      - "scripts/assemble_notice_*"
      - "data/notice-*-source-manifest.json"
      - "data/notice-*-source-snapshots.json"
      - "data/notice-*-current-assembly.json"
      - "data/notice-*-current-text-candidates.json"
      - ".github/workflows/verify-notice-rouki25-independent.yml"
  push:
    branches: [main]
    paths:
      - "scripts/verify_notice_rouki25_independent.py"
      - "scripts/import_notice_*"
      - "scripts/assemble_notice_*"
      - "data/notice-*-source-manifest.json"
      - "data/notice-*-source-snapshots.json"
      - "data/notice-*-current-assembly.json"
      - "data/notice-*-current-text-candidates.json"
      - ".github/workflows/verify-notice-rouki25-independent.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install independent PDF text tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Reparse and replay MHLW sources independently
        id: verify
        shell: bash
        run: |
          set +e
          python scripts/verify_notice_rouki25_independent.py --report rouki25-independent-verification.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rouki25-independent-verification
          path: rouki25-independent-verification.json
          if-no-files-found: warn
      - name: Fail on verification differences
        if: steps.verify.outputs.exit_code != '0'
        run: exit 1
