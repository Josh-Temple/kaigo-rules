name: Structural completeness wave integrator

on:
  push:
    branches:
      - work/structural-completeness-wave-integrator
    paths:
      - ".github/workflows/structural-completeness-wave-integrator.yml"

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/structural-completeness-wave-integrator
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Fetch and pin Worker A-D heads
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/work/fee-guidance-remaining-nonpreventive:refs/remotes/origin/work/fee-guidance-remaining-nonpreventive \
            +refs/heads/work/fee-guidance-remaining-preventive:refs/remotes/origin/work/fee-guidance-remaining-preventive \
            +refs/heads/work/delegated-remuneration-residual-closure:refs/remotes/origin/work/delegated-remuneration-residual-closure \
            +refs/heads/work/other-national-materials-discovery-foundation:refs/remotes/origin/work/other-national-materials-discovery-foundation

          test "$(git rev-parse origin/main)" = "754bc7b223db4aa35675c840f1a0032ca71eeb96"
          test "$(git rev-parse origin/work/fee-guidance-remaining-nonpreventive)" = "b9eb50668ea2d52653560251eb9db34f4776c47f"
          test "$(git rev-parse origin/work/fee-guidance-remaining-preventive)" = "442ec22fbcee3d7dfe0c1275ef278045d082a6a0"
          test "$(git rev-parse origin/work/delegated-remuneration-residual-closure)" = "4686c4766e4fbca5bf7727a45895a01a453a8702"
          test "$(git rev-parse origin/work/other-national-materials-discovery-foundation)" = "607c405af28e45ba745731e509cc8aa07542e021"

      - name: Merge independent Worker D and C changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff --no-edit origin/work/other-national-materials-discovery-foundation
          git merge --no-ff --no-edit origin/work/delegated-remuneration-residual-closure

      - name: Merge Worker A
        shell: bash
        run: |
          set -euo pipefail
          git merge --no-ff --no-edit origin/work/fee-guidance-remaining-nonpreventive

      - name: Semantically merge Worker B fee-guidance additions
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git merge --no-ff --no-commit origin/work/fee-guidance-remaining-preventive
          merge_rc=$?
          set -e
          echo "Worker B textual merge exit code: $merge_rc"

          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          BASE = "origin/main"
          A = "origin/work/fee-guidance-remaining-nonpreventive"
          B = "origin/work/fee-guidance-remaining-preventive"

          specs = [
              ("data/shared/fee-guidance/national-corpus.json", "nodes", "id"),
              ("data/shared/fee-guidance/node-identity-map.json", "identities", "node_id"),
              ("data/shared/fee-guidance/source-registry.json", "sources", "id"),
              ("data/shared/fee-guidance/service-applicability.json", "services", "service_id"),
              ("data/shared/fee-guidance/service-relations.json", "relations", "id"),
          ]

          def load(ref, path):
              raw = subprocess.check_output(["git", "show", f"{ref}:{path}"], text=True)
              return json.loads(raw)

          for path, array_key, id_key in specs:
              base = load(BASE, path)
              a = load(A, path)
              b = load(B, path)

              if set(base) != set(a) or set(base) != set(b):
                  raise SystemExit(f"top-level schema drift in {path}")
              for key in base:
                  if key == array_key:
                      continue
                  if a[key] != base[key] or b[key] != base[key]:
                      raise SystemExit(f"non-array field changed by worker in {path}: {key}")

              base_map = {x[id_key]: x for x in base[array_key]}
              a_map = {x[id_key]: x for x in a[array_key]}
              b_map = {x[id_key]: x for x in b[array_key]}

              for identity, item in base_map.items():
                  if identity not in a_map or identity not in b_map:
                      raise SystemExit(f"worker deleted base identity {identity} in {path}")
                  if a_map[identity] != item or b_map[identity] != item:
                      raise SystemExit(f"worker modified base identity {identity} in {path}")

              a_added = [x for x in a[array_key] if x[id_key] not in base_map]
              b_added = [x for x in b[array_key] if x[id_key] not in base_map]
              a_added_map = {x[id_key]: x for x in a_added}

              merged_added = list(a_added)
              for item in b_added:
                  identity = item[id_key]
                  if identity in a_added_map:
                      if a_added_map[identity] != item:
                          raise SystemExit(f"conflicting new identity {identity} in {path}")
                  else:
                      merged_added.append(item)

              merged = dict(base)
              merged[array_key] = list(base[array_key]) + merged_added
              Path(path).write_text(
                  json.dumps(merged, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              print(path, "base", len(base[array_key]), "A+", len(a_added), "B+", len(b_added), "merged", len(merged[array_key]))
          PY

          git add             data/shared/fee-guidance/national-corpus.json             data/shared/fee-guidance/node-identity-map.json             data/shared/fee-guidance/source-registry.json             data/shared/fee-guidance/service-applicability.json             data/shared/fee-guidance/service-relations.json

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "::error::Unexpected unresolved merge conflicts:"
            echo "$unresolved"
            exit 1
          fi

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "Semantic merge Worker B fee-guidance additions"
          fi

      - name: Regenerate repository-wide derived artifacts once
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_careact_service_indexes.py
          python scripts/build_service_catalog.py
          python scripts/build_homevisit_careact_index.py
          python scripts/build_homevisit_ordinance37_index.py
          python scripts/build_dayrehab_article119_relations.py
          python scripts/build_dayrehab_ordinance37_index.py
          python scripts/build_notice_review_packet.py
          python scripts/build_notice_rouki25_audit_report.py
          python scripts/import_delegated_remuneration_national_corpus.py
          python scripts/build_delegated_remuneration_shared_corpus.py
          python scripts/build_remuneration_source_link_derived_audit.py
          python scripts/build_notice_ordinance_explicit_reference_derived_audit.py
          python scripts/build_careact_service_identity_derived_audit.py
          python scripts/build_relation_verification_queue.py
          python scripts/build_relation_human_review_packet.py
          python scripts/build_relation_human_review_evidence_pack.py
          python scripts/build_verification_registry.py
          python scripts/build_database_coverage_matrix.py
          python scripts/build_product_value_snapshot.py
          python scripts/build_question_context_packages.py
          python scripts/build_shared_standards_service_relations.py
          python scripts/build_qa_service_relations.py

      - name: Validate Other National Materials discovery foundation
        run: python scripts/validate_other_national_materials.py

      - name: Run full repository validation
        run: npm run validate:data

      - name: Build application
        run: npm run build

      - name: Compile production verifier
        run: python -m py_compile scripts/verify_field_validation_production.py

      - name: Commit integrated and regenerated state, removing one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/structural-completeness-wave-integrator.yml
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "::error::No integration/regeneration changes to commit"
            exit 1
          fi
          git commit -m "Integrate structural completeness wave and regenerate artifacts"
          git push origin HEAD:work/structural-completeness-wave-integrator

# rerun: regression expectations updated for structural completeness expansion
