name: Update Care Insurance Act database

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-care-insurance-act.yml"
      - "scripts/import_egov_care_insurance_act.py"
      - "scripts/verify_egov_content_independent.py"
      - "scripts/record_egov_content_independent_audit.py"
      - "data/care-insurance-act-corpus-scope.json"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Import shared Care Insurance Act corpus from e-Gov
        run: python scripts/import_egov_care_insurance_act.py

      - name: Rebuild dependent service index
        run: python scripts/build_homevisit_careact_index.py

      - name: Independently reparse shared e-Gov law content
        run: python scripts/verify_egov_content_independent.py --report egov-content-independent-verification.json

      - name: Record pinned independent audit receipt
        run: |
          python scripts/record_egov_content_independent_audit.py \
            --report egov-content-independent-verification.json \
            --run-id "${GITHUB_RUN_ID}" \
            --head-sha "${GITHUB_SHA}"

      - name: Rebuild derived verification state
        run: |
          python scripts/build_careact_service_identity_derived_audit.py
          python scripts/build_relation_verification_queue.py
          python scripts/build_verification_registry.py
          python scripts/build_product_value_snapshot.py

      - name: Validate shared-corpus safety boundary
        run: |
          node scripts/validate-data.mjs
          python scripts/validate_egov_content_independent_audit.py
          python scripts/build_homevisit_careact_index.py --check
          python scripts/build_verification_registry.py --check

      - name: Detect changes
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- \
            data/care-insurance-act-nodes.json \
            data/care-insurance-act-relations.json \
            data/care-insurance-act-meta.json \
            data/services/homevisit/care-insurance-act-index.generated.json \
            data/egov-content-independent-audit.json \
            data/careact-service-identity-derived-audit.json \
            data/relation-verification-queue.json \
            data/verification-registry.json \
            data/product-value-snapshot-v0.1.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push review branch
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          BRANCH="automation/care-act-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add \
            data/care-insurance-act-nodes.json \
            data/care-insurance-act-relations.json \
            data/care-insurance-act-meta.json \
            data/services/homevisit/care-insurance-act-index.generated.json \
            data/egov-content-independent-audit.json \
            data/careact-service-identity-derived-audit.json \
            data/relation-verification-queue.json \
            data/verification-registry.json \
            data/product-value-snapshot-v0.1.json
          git commit -m "data: refresh shared Care Insurance Act corpus"
          git push origin "$BRANCH"
          {
            echo "## Shared Care Insurance Act corpus ready for review"
            echo ""
            echo "Branch: `$BRANCH`"
            echo ""
            echo "Generated source text remains IMPORTED_NEEDS_HUMAN_CHECK. Service applicability is not promoted."
          } >> "$GITHUB_STEP_SUMMARY"
