name: Materialize homevisit unit price

on:
  push:
    branches:
      - db/homevisit-unit-price-ingestion

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: db/homevisit-unit-price-ingestion
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Regenerate canonical projections
        run: |
          python scripts/build_service_catalog.py
          python scripts/build_database_coverage_matrix.py
      - name: Commit generated projections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/services/catalog.generated.json data/database-coverage-matrix.generated.json docs/database-coverage-summary.generated.md
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Regenerate projections after homevisit unit-price ingestion"
            git push
          fi
