name: Verify relation review packet hardening

on:
  pull_request:
    branches: [main]
    paths:
      - "data/relation-verification-queue.json"
      - "data/relation-human-review-packet.json"
      - "data/relation-human-review-evidence-pack.json"
      - "scripts/build_relation_human_review_packet.py"
      - "scripts/build_relation_human_review_evidence_pack.py"
      - "scripts/validate_relation_review_packet_hardening.py"
      - "scripts/relation_verification_coverage.py"
      - "tests/test_relation_human_review_packet.py"
      - "tests/test_relation_human_review_evidence_pack.py"
      - "tests/test_relation_review_packet_hardening.py"
      - ".github/workflows/verify-relation-review-packet-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check deterministic packet generation
        run: |
          python scripts/build_relation_verification_queue.py --check
          python scripts/build_relation_human_review_packet.py --check
          python scripts/build_relation_human_review_evidence_pack.py --check
      - name: Validate Worker D hardening invariants
        run: python scripts/validate_relation_review_packet_hardening.py
      - name: Run focused relation-review tests
        run: |
          python -m unittest             tests.test_relation_human_review_packet             tests.test_relation_human_review_evidence_pack             tests.test_relation_review_packet_hardening
