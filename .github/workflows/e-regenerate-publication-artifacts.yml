name: E regenerate integrated publication artifacts
# retrigger-after-canonical-writeback

on:
  push:
    branches:
      - integrate/public-value-expansion-20261006-e

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Regenerate canonical integrated artifacts
        run: |
          python scripts/build_database_coverage_matrix.py
          python scripts/build_publication_requirement_scoping.py
          python scripts/build_publication_readiness.py
          python scripts/build_bounded_publication_allowlist.py
          python scripts/build_product_value_snapshot.py

      - name: Commit regenerated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/database-coverage-matrix.generated.json \
                  docs/database-coverage-summary.generated.md \
                  data/publication-requirement-scoping.json \
                  data/publication-readiness.generated.json \
                  data/bounded-publication-allowlist.json \
                  data/product-value-snapshot-v0.1.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "E integration: regenerate publication artifacts"
          git push origin HEAD:${GITHUB_REF_NAME}
