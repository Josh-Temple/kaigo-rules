name: Build remuneration notification assurance evidence

on:
  pull_request:
    paths:
      - "scripts/build_remuneration_notification_assurance.py"
      - "data/services/**"
      - ".github/workflows/build-remuneration-notification-assurance-evidence.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-evidence:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build primary-source fingerprints
        run: python scripts/build_remuneration_notification_assurance.py --observed-date 2026-10-05
      - name: Commit candidate evidence to worker branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shared/remuneration-notification/body-fingerprints.json data/shared/remuneration-notification/service-item-body-assurance.json
          if git diff --cached --quiet; then
            echo "No evidence changes"
          else
            git commit -m "Add remuneration notification assurance evidence"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: remuneration-notification-assurance-candidate
          path: data/shared/remuneration-notification/*.json
          if-no-files-found: error
