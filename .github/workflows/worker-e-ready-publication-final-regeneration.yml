name: Worker E ready-publication final regeneration

on:
  push:
    branches:
      - integration/ready-publication-currentness-expansion-wave-e-20261007
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate-validate-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: integration/ready-publication-currentness-expansion-wave-e-20261007
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate integrated currentness inputs
        run: |
          python scripts/build_delegated_remuneration_currentness_worker_b.py --check
          python scripts/validate_delegated_remuneration_currentness_worker_b.py
          python scripts/validate_final_standards_residual_relation_worker_c.py

      - name: Regenerate canonical integration artifacts
        run: |
          python scripts/build_verification_registry.py
          python scripts/build_database_coverage_matrix.py
          python scripts/build_publication_requirement_scoping.py
          python scripts/build_publication_readiness.py
          python scripts/build_bounded_publication_allowlist.py
          python scripts/build_product_value_snapshot.py

      - name: Validate currentness and publication boundaries
        run: |
          python scripts/validate_currentness_evidence_expansion_wave.py
          python scripts/validate_delegated_remuneration_currentness_worker_b.py
          python scripts/validate_final_standards_residual_relation_worker_c.py
          python -m unittest tests.test_multi_source_runtime_allowlist
          node --experimental-strip-types --test tests/progressive-publication-runtime.test.mjs
          node --experimental-strip-types --test tests/database-global-search.test.mjs
          node --experimental-strip-types --test tests/practical-navigation.test.mjs

      - name: Full validation
        run: npm run validate:data

      - name: Production build
        run: npm run build

      - name: Commit regenerated canonical artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No regenerated artifact changes."
          else
            echo "Regenerated files:"
            git diff --cached --name-only
            git commit -m "[Worker E] Final canonical regeneration for ready publication wave"
            git push origin HEAD:integration/ready-publication-currentness-expansion-wave-e-20261007
          fi
