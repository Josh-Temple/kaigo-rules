name: Verify day-service unit price independently

on:
  workflow_dispatch:
  schedule:
    - cron: "11 3 * * 1"
  pull_request:
    paths:
      - "scripts/verify_unit_price_independent.py"
      - "scripts/import_unit_price.py"
      - "data/unit-price-dayservice.json"
      - "data/unit-price-dayservice-meta.json"
      - "data/unit-price-region-assignments.json"
      - "data/unit-price-region-assignments-meta.json"
      - ".github/workflows/verify-unit-price-independent.yml"
      - "data/unit-price-independent-audit.json"
      - "scripts/validate_unit_price_independent_audit.py"
  push:
    branches: [main]
    paths:
      - "scripts/verify_unit_price_independent.py"
      - "scripts/import_unit_price.py"
      - "data/unit-price-dayservice.json"
      - "data/unit-price-dayservice-meta.json"
      - "data/unit-price-region-assignments.json"
      - "data/unit-price-region-assignments-meta.json"
      - ".github/workflows/verify-unit-price-independent.yml"
      - "data/unit-price-independent-audit.json"
      - "scripts/validate_unit_price_independent_audit.py"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Reparse current MHLW HTML independently
        id: verify
        shell: bash
        run: |
          set +e
          python scripts/verify_unit_price_independent.py --report unit-price-independent-verification.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Validate pinned audit provenance
        run: python scripts/validate_unit_price_independent_audit.py
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-price-independent-verification
          path: unit-price-independent-verification.json
          if-no-files-found: warn
      - name: Fail on verification differences
        if: steps.verify.outputs.exit_code != '0'
        run: exit 1
