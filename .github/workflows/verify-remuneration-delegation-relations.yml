name: Verify remuneration delegation relations independently

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/verify_remuneration_delegation_relations.py"
      - "data/remuneration-delegated-relations.json"
      - ".github/workflows/verify-remuneration-delegation-relations.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify remuneration delegation relations
        run: python scripts/verify_remuneration_delegation_relations.py --report remuneration-delegation-relation-verification.json
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remuneration-delegation-relation-verification
          path: remuneration-delegation-relation-verification.json
          if-no-files-found: warn
