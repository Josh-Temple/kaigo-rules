name: Integrator one-shot regenerate

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.head_ref == 'work/core-item-body-assurance-integrator'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/core-item-body-assurance-integrator
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate repository-wide derived artifacts once
        run: |
          python scripts/build_service_catalog.py
          python scripts/build_verification_registry.py
          python scripts/build_database_coverage_matrix.py
          python scripts/build_product_value_snapshot.py
          python scripts/build_question_context_packages.py
      - name: Check regenerated artifacts
        run: |
          python scripts/build_service_catalog.py --check
          python scripts/build_verification_registry.py --check
          python scripts/build_database_coverage_matrix.py --check
          python scripts/build_product_value_snapshot.py --check
          python scripts/build_question_context_packages.py --check
      - name: Commit regenerated artifacts
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[integrator generated] Regenerate core item-body assurance projections"
          git push origin HEAD:work/core-item-body-assurance-integrator
