name: Verify remuneration sources independently

on:
  workflow_dispatch:
  schedule:
    - cron: "21 3 * * 1"
  pull_request:
    paths:
      - "scripts/verify_remuneration_independent.py"
      - "scripts/import_current_remuneration.py"
      - "scripts/import_remuneration_delegated.py"
      - "data/remuneration-current-text.json"
      - "data/remuneration-current-text-meta.json"
      - "data/remuneration-delegated-nodes.json"
      - "data/remuneration-delegated-meta.json"
      - ".github/workflows/verify-remuneration-independent.yml"
      - "data/remuneration-independent-audit.json"
      - "scripts/validate_remuneration_independent_audit.py"
  push:
    branches: [main]
    paths:
      - "scripts/verify_remuneration_independent.py"
      - "scripts/import_current_remuneration.py"
      - "scripts/import_remuneration-delegated.py"
      - "data/remuneration-current-text.json"
      - "data/remuneration-current-text-meta.json"
      - "data/remuneration-delegated-nodes.json"
      - "data/remuneration-delegated-meta.json"
      - ".github/workflows/verify-remuneration-independent.yml"
      - "data/remuneration-independent-audit.json"
      - "scripts/validate_remuneration_independent_audit.py"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Reparse current MHLW remuneration sources independently
        id: verify
        shell: bash
        run: |
          set +e
          python scripts/verify_remuneration_independent.py --report remuneration-independent-verification.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Validate pinned audit provenance
        run: python scripts/validate_remuneration_independent_audit.py
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remuneration-independent-verification
          path: remuneration-independent-verification.json
          if-no-files-found: warn
      - name: Fail on verification differences
        if: steps.verify.outputs.exit_code != '0'
        run: exit 1
