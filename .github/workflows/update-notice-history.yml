name: Extract historical notice backfill candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-notice-history.yml"
      - "scripts/extract_notice_history.py"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install HTML parser
        run: python -m pip install beautifulsoup4==4.13.4

      - name: Extract historical backfill candidates
        run: python scripts/extract_notice_history.py

      - name: Validate data references
        run: node scripts/validate-data.mjs

      - name: Detect changes
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- data/notice-historical-backfill.json data/notice-historical-backfill-meta.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push review branch
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          BRANCH="automation/notice-history-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add data/notice-historical-backfill.json data/notice-historical-backfill-meta.json
          git commit -m "data: refresh historical notice backfill candidates"
          git push origin "$BRANCH"
          {
            echo "## Historical notice backfill ready for review"
            echo ""
            echo "Branch: `$BRANCH`"
            echo ""
            echo "Candidates remain historical-only and require forward replay before promotion."
          } >> "$GITHUB_STEP_SUMMARY"
