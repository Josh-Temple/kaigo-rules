name: Verify Care Insurance Act internal relations independently

on:
  workflow_dispatch:
  schedule:
    - cron: "27 4 * * 1"
  pull_request:
    paths:
      - "scripts/verify_careact_internal_relations_independent.py"
      - "data/care-insurance-act-nodes.json"
      - "data/care-insurance-act-relations.json"
      - "data/relation-semantic-independent-audit.json"
      - "data/careact-internal-relation-independent-audit.json"
      - "scripts/validate_careact_internal_relation_independent_audit.py"
      - ".github/workflows/verify-careact-internal-relations-independent.yml"
  push:
    branches: [main]
    paths:
      - "scripts/verify_careact_internal_relations_independent.py"
      - "data/care-insurance-act-nodes.json"
      - "data/care-insurance-act-relations.json"
      - "data/careact-internal-relation-independent-audit.json"
      - "scripts/validate_careact_internal_relation_independent_audit.py"
      - ".github/workflows/verify-careact-internal-relations-independent.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Independently verify Care Insurance Act internal relations
        id: verify
        shell: bash
        run: |
          set +e
          python scripts/verify_careact_internal_relations_independent.py --report careact-internal-relation-independent-verification.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Validate pinned audit provenance
        run: python scripts/validate_careact_internal_relation_independent_audit.py
      - name: Upload independent verification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: careact-internal-relation-independent-verification
          path: careact-internal-relation-independent-verification.json
          if-no-files-found: warn
      - name: Fail on relation differences
        if: steps.verify.outputs.exit_code != '0'
        run: exit 1
