name: Security lockfile refresh (temporary)
on:
  push:
    branches:
      - security/nextjs-16-4-1-manifest-20261021
    paths:
      - '.github/workflows/security-lockfile-one-shot.yml'

permissions:
  contents: write

jobs:
  resolve:
    if: github.repository == 'Josh-Temple/kaigo-rules' && github.ref == 'refs/heads/security/nextjs-16-4-1-manifest-20261021'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Regenerate both lockfiles without lifecycle scripts
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          (cd ops-site && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
      - name: Verify patch versions at both roots
        run: |
          node - <<'NODE'
          for (const prefix of ['.', './ops-site']) {
            const pkg = require(prefix + '/package.json'), lock = require(prefix + '/package-lock.json');
            for (const name of ['next','react','react-dom']) {
              const version = pkg.dependencies[name];
              if (lock.packages[''].dependencies[name] !== version || lock.packages['node_modules/' + name].version !== version) throw Error(prefix + ': ' + name + ' mismatch');
            }
          }
          console.log('Both sites have patched lockfiles');
          NODE
      - name: Commit only dependency lockfiles to security branch
        run: |
          git add package-lock.json ops-site/package-lock.json
          if git diff --cached --quiet; then echo 'Already consistent'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: lock patched Next.js and React in both sites'
          git push origin HEAD:refs/heads/security/nextjs-16-4-1-manifest-20261021
