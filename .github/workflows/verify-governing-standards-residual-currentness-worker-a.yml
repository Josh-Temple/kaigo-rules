name: Verify Worker A governing standards residual currentness

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "data/verification/governing-standards-residual-currentness-worker-a.json"
      - "scripts/validate_governing_standards_residual_currentness_worker_a.py"
      - "tests/test_governing_standards_residual_currentness_worker_a.py"
      - "scripts/build_database_coverage_matrix.py"
      - "data/verification/shared-source-currentness-activation.json"
      - "data/shared/standards/**"
      - "data/services/*/shared-corpus-scope.json"
      - "data/services/*/governing-standards-scope.json"
      - "data/services/*/standards36-scope.json"
      - ".github/workflows/verify-governing-standards-residual-currentness-worker-a.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Validate exact-cell currentness decisions
        run: python scripts/validate_governing_standards_residual_currentness_worker_a.py

      - name: Run fail-closed regression tests
        run: python -m unittest tests.test_governing_standards_residual_currentness_worker_a

      - name: Independently reparse shared standards from live e-Gov
        run: python scripts/verify_shared_standards_independent.py --report /tmp/shared-standards-worker-a-live.json

      - name: Recheck shared standards source freshness against live e-Gov
        run: python scripts/verify_shared_standards_source_freshness.py --report /tmp/shared-standards-worker-a-freshness.json

      - name: Verify in-memory coverage projection
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          root = Path(".").resolve()
          script = root / "scripts/build_database_coverage_matrix.py"
          spec = importlib.util.spec_from_file_location("coverage_builder", script)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)
          matrix = module.build()
          family = matrix["summary"]["source_family_coverage"]["governing_standards_ordinance"]
          currentness = family["currentness"]
          if currentness != {"NOT_ESTABLISHED": 2, "PASS": 37}:
              raise SystemExit(f"unexpected projected governing-standards currentness: {currentness}")
          gaps = [
              row for row in matrix["summary"]["currentness_gaps"]
              if row["source_family"] == "governing_standards_ordinance"
          ]
          gap_ids = {row["service_id"] for row in gaps}
          expected_gaps = {"night-homevisit", "dementia-group-home"}
          if gap_ids != expected_gaps:
              raise SystemExit(f"unexpected residual governing-standards currentness gaps: {gaps}")
          print("PASS: in-memory projection reaches 37/39 with two explicit fail-closed residuals")
          PY

      - name: Reject Worker A edits to repository-wide generated publication artifacts
        if: github.event_name == 'pull_request' && !startsWith(github.event.pull_request.title, '[Worker E]')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          for path in \
            data/database-coverage-matrix.generated.json \
            docs/database-coverage-summary.generated.md \
            data/publication-requirement-scoping.json \
            data/publication-readiness.generated.json \
            data/bounded-publication-allowlist.generated.json \
            data/product-value-snapshot-v0.1.json
          do
            if printf '%s\n' "$changed" | grep -Fxq "$path"; then
              echo "Worker A must not edit generated/readiness/publication artifact: $path" >&2
              exit 1
            fi
          done
