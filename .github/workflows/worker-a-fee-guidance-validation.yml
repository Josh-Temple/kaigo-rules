name: Worker A Fee Guidance Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-worker-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Validate shared fee guidance canonical chain
        run: python scripts/validate_shared_fee_guidance.py
      - name: Validate final-six adjudications
        run: python scripts/validate_fee_guidance_final_six_adjudications.py
      - name: Run focused regression tests
        run: python -m unittest tests.test_shared_fee_guidance
