name: Worker A Fee Guidance Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-worker-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Validate shared fee guidance canonical chain
        run: python scripts/validate_shared_fee_guidance.py
      - name: Run focused fee guidance and coverage projection regression tests
        run: python -m unittest tests.test_shared_fee_guidance tests.test_database_coverage_matrix
      - name: Assert final-six projection
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import build_database_coverage_matrix as coverage

          matrix = coverage.build()
          rows = {
              row["service_id"]: next(
                  cell for cell in row["source_families"]
                  if cell["source_family"] == "fee_calculation_guidance"
              )
              for row in matrix["services"]
          }

          mapped = {
              "preventive-dementia-dayservice",
              "preventive-small-scale-multifunctional",
              "preventive-dementia-group-home",
          }
          not_applicable = {
              "specific-welfare-equipment-sale",
              "specific-preventive-welfare-equipment-sale",
          }

          for service_id in mapped:
              assert rows[service_id]["service_scope"]["state"] == "SCOPE_DEFINED"
              assert rows[service_id]["service_applicability"]["state"] == "MAPPED"
              assert rows[service_id]["ingestion"]["state"] == "PARTIAL"

          for service_id in not_applicable:
              assert rows[service_id]["service_scope"]["state"] == "SCOPE_DEFINED"
              assert rows[service_id]["service_applicability"]["state"] == "NOT_APPLICABLE"
              assert rows[service_id]["ingestion"]["state"] == "NOT_APPLICABLE"

          support = rows["preventive-support"]
          assert support["service_scope"]["state"] == "SCOPE_NOT_DEFINED"
          assert support["service_applicability"]["state"] == "UNRESOLVED"
          assert support["ingestion"]["state"] == "NOT_INGESTED"

          residual = [
              service_id for service_id, row in rows.items()
              if row["service_scope"]["state"] == "SCOPE_NOT_DEFINED"
          ]
          assert residual == ["preventive-support"], residual

          for service_id in mapped | not_applicable | {"preventive-support"}:
              row = rows[service_id]
              assert row["item_body_verification"]["state"] == "NOT_ESTABLISHED"
              assert row["currentness"]["state"] == "NOT_ESTABLISHED"
              assert row["human_review"]["state"] == "NOT_REVIEWED"
              assert row["route_exposure"]["state"] == "BLOCKED"

          print("Worker A projection PASS; residual:", residual)
          PY
