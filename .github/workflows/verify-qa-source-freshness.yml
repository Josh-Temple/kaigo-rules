name: Verify MHLW Q&A source freshness

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"
  pull_request:
    paths:
      - "scripts/verify_qa_source_freshness.py"
      - "data/qa-corpus-meta.json"
      - ".github/workflows/verify-qa-source-freshness.yml"
  push:
    branches: [main]
    paths:
      - "scripts/verify_qa_source_freshness.py"
      - "data/qa-corpus-meta.json"
      - ".github/workflows/verify-qa-source-freshness.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Compare current MHLW Q&A source with committed metadata
        id: verify
        shell: bash
        run: |
          set +e
          python scripts/verify_qa_source_freshness.py --report qa-source-freshness.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload freshness report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-source-freshness
          path: qa-source-freshness.json
          if-no-files-found: warn
      - name: Fail when Q&A source drift is detected
        if: steps.verify.outputs.exit_code != '0'
        run: exit 1
