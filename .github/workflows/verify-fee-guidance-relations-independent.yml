name: Verify fee-guidance relations independently

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/verify_fee_guidance_relations_independent.py"
      - "data/fee-guidance-relations.json"
      - ".github/workflows/verify-fee-guidance-relations-independent.yml"
  push:
    branches: [main]
    paths:
      - "scripts/verify_fee_guidance_relations_independent.py"
      - "data/fee-guidance-relations.json"
      - ".github/workflows/verify-fee-guidance-relations-independent.yml"
  schedule:
    - cron: "42 4 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Independently verify fee-guidance relations
        id: verify
        shell: bash
        run: |
          set +e
          python scripts/verify_fee_guidance_relations_independent.py --report fee-guidance-relation-independent-verification.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload independent relation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fee-guidance-relation-independent-verification
          path: fee-guidance-relation-independent-verification.json
          if-no-files-found: warn
      - name: Fail on relation differences
        if: steps.verify.outputs.exit_code != '0'
        run: exit 1
