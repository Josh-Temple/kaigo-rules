name: Structural completeness generated-bytecode cleanup

on:
  push:
    branches:
      - work/structural-completeness-wave-integrator
    paths:
      - ".github/workflows/structural-completeness-generated-bytecode-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: work/structural-completeness-wave-integrator
          fetch-depth: 0
      - name: Remove newly generated bytecode and one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f             scripts/__pycache__/validate_other_national_materials.cpython-312.pyc             scripts/__pycache__/verify_field_validation_production.cpython-312.pyc             tests/__pycache__/test_other_national_materials.cpython-312.pyc
          rm .github/workflows/structural-completeness-generated-bytecode-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrator: remove generated bytecode artifacts"
          git push origin HEAD:work/structural-completeness-wave-integrator
