name: Worker E cleanup generated bytecode

on:
  push:
    branches:
      - integration/ready-publication-currentness-expansion-wave-e-20261007

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - name: Remove generated Python bytecode
        run: |
          find scripts tests -type f -path '*/__pycache__/*.pyc' -delete
          find scripts tests -type d -name '__pycache__' -empty -delete
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No bytecode files to remove."
          else
            git commit -m "[Worker E] Remove generated Python bytecode"
            git push origin HEAD:integration/ready-publication-currentness-expansion-wave-e-20261007
          fi
