name: Generate npm lockfiles (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/generate-package-locks-temp.yml"

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate root lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Generate ops lockfile
        working-directory: ops-site
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Switch CI to npm ci
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in [
              ".github/workflows/validate-build.yml",
              ".github/workflows/validate-ops-site.yml",
          ]:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              updated = text.replace(
                  "npm install --no-audit --no-fund",
                  "npm ci --no-audit --no-fund",
              )
              if updated == text:
                  raise SystemExit(f"expected npm install command not found in {name}")
              path.write_text(updated, encoding="utf-8")
          PY
      - name: Commit generated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/generate-package-locks-temp.yml
          git add package-lock.json ops-site/package-lock.json             .github/workflows/validate-build.yml             .github/workflows/validate-ops-site.yml
          git diff --cached --check
          git commit -m "Pin npm dependency graphs"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
