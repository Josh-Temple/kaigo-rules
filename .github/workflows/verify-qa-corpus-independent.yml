name: Verify MHLW Q&A corpus independently

on:
  workflow_dispatch:
  schedule:
    - cron: "46 3 * * 1"
  pull_request:
    paths:
      - "scripts/verify_qa_corpus_independent.py"
      - "scripts/import_mhlw_qa.py"
      - "data/qa-corpus.json"
      - "data/qa-corpus-meta.json"
      - ".github/workflows/verify-qa-corpus-independent.yml"
      - "data/qa-corpus-independent-audit.json"
      - "scripts/validate_qa_corpus_independent_audit.py"
  push:
    branches: [main]
    paths:
      - "scripts/verify_qa_corpus_independent.py"
      - "scripts/import_mhlw_qa.py"
      - "data/qa-corpus.json"
      - "data/qa-corpus-meta.json"
      - ".github/workflows/verify-qa-corpus-independent.yml"
      - "data/qa-corpus-independent-audit.json"
      - "scripts/validate_qa_corpus_independent_audit.py"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Independently parse MHLW Q&A XLSX package
        id: verify
        shell: bash
        run: |
          set +e
          python scripts/verify_qa_corpus_independent.py --report qa-corpus-independent-verification.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Validate pinned audit provenance
        run: python scripts/validate_qa_corpus_independent_audit.py
      - name: Upload independent verification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-corpus-independent-verification
          path: qa-corpus-independent-verification.json
          if-no-files-found: warn
      - name: Fail on corpus differences
        if: steps.verify.outputs.exit_code != '0'
        run: exit 1
