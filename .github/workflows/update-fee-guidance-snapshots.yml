name: Update fee guidance source snapshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/update-fee-guidance-snapshots.yml"
      - "data/fee-guidance-source-manifest.json"
      - "data/sources.json"
      - "scripts/import_fee_guidance_snapshots.py"
      - "scripts/validate-data.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-fee-guidance-snapshots.yml"
      - "data/fee-guidance-source-manifest.json"
      - "data/sources.json"
      - "scripts/import_fee_guidance_snapshots.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Rebuild official PDF snapshots
        run: python scripts/import_fee_guidance_snapshots.py
      - name: Validate data
        run: node scripts/validate-data.mjs
      - name: Detect snapshot changes
        id: diff
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- data/fee-guidance-source-snapshots.json)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Summarize pull request validation
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          echo "Snapshot importer completed successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "Generated snapshot changed: ${{ steps.diff.outputs.changed }}" >> "$GITHUB_STEP_SUMMARY"
          echo "No human-review status is modified by this workflow." >> "$GITHUB_STEP_SUMMARY"
      - name: Push review branch
        if: github.event_name != 'pull_request' && steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          BRANCH="automation/fee-guidance-snapshots-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add data/fee-guidance-source-snapshots.json
          git commit -m "data: refresh fee guidance PDF snapshots"
          git push origin "$BRANCH"
          echo "Generated review branch: $BRANCH" >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize no change
        if: github.event_name != 'pull_request' && steps.diff.outputs.changed != 'true'
        run: echo "Official PDF snapshots are unchanged." >> "$GITHUB_STEP_SUMMARY"
