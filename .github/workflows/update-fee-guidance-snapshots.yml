name: Update fee guidance source snapshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/update-fee-guidance-snapshots.yml"
      - "data/fee-guidance-source-manifest.json"
      - "data/fee-guidance-current-assembly.json"
      - "data/fee-guidance-current-skeleton.json"
      - "data/fee-guidance-replay-coverage.json"
      - "data/sources.json"
      - "scripts/import_fee_guidance_snapshots.py"
      - "scripts/assemble_fee_guidance_current_candidates.py"
      - "scripts/validate-data.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-fee-guidance-snapshots.yml"
      - "data/fee-guidance-source-manifest.json"
      - "data/fee-guidance-current-assembly.json"
      - "data/fee-guidance-current-skeleton.json"
      - "data/fee-guidance-replay-coverage.json"
      - "data/sources.json"
      - "scripts/import_fee_guidance_snapshots.py"
      - "scripts/assemble_fee_guidance_current_candidates.py"

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Rebuild official PDF snapshots
        run: python scripts/import_fee_guidance_snapshots.py
      - name: Assemble current-text candidates
        run: python scripts/assemble_fee_guidance_current_candidates.py
      - name: Validate data
        run: node scripts/validate-data.mjs
      - name: Detect snapshot changes
        id: diff
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- data/fee-guidance-source-snapshots.json data/fee-guidance-current-text-candidates.json)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Summarize pull request validation
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          echo "Snapshot importer and current-text candidate assembly completed successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "Generated evidence/candidates changed: ${{ steps.diff.outputs.changed }}" >> "$GITHUB_STEP_SUMMARY"
          echo "No human-review status is modified by this workflow." >> "$GITHUB_STEP_SUMMARY"
      - name: Push review branch
        if: github.event_name != 'pull_request' && steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          BRANCH="automation/fee-guidance-snapshots-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add data/fee-guidance-source-snapshots.json data/fee-guidance-current-text-candidates.json
          git commit -m "data: refresh fee guidance evidence and candidates"
          git push origin "$BRANCH"
          echo "Generated review branch: $BRANCH" >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize no change
        if: github.event_name != 'pull_request' && steps.diff.outputs.changed != 'true'
        run: echo "Official PDF snapshots and current-text candidates are unchanged." >> "$GITHUB_STEP_SUMMARY"

  update:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Rebuild official PDF snapshots
        run: python scripts/import_fee_guidance_snapshots.py
      - name: Assemble current-text candidates
        run: python scripts/assemble_fee_guidance_current_candidates.py
      - name: Validate data
        run: node scripts/validate-data.mjs
      - name: Detect snapshot changes
        id: diff
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- data/fee-guidance-source-snapshots.json data/fee-guidance-current-text-candidates.json)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Summarize pull request validation
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          echo "Snapshot importer and current-text candidate assembly completed successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "Generated evidence/candidates changed: ${{ steps.diff.outputs.changed }}" >> "$GITHUB_STEP_SUMMARY"
          echo "No human-review status is modified by this workflow." >> "$GITHUB_STEP_SUMMARY"
      - name: Push review branch
        if: github.event_name != 'pull_request' && steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          BRANCH="automation/fee-guidance-snapshots-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add data/fee-guidance-source-snapshots.json data/fee-guidance-current-text-candidates.json
          git commit -m "data: refresh fee guidance evidence and candidates"
          git push origin "$BRANCH"
          echo "Generated review branch: $BRANCH" >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize no change
        if: github.event_name != 'pull_request' && steps.diff.outputs.changed != 'true'
        run: echo "Official PDF snapshots and current-text candidates are unchanged." >> "$GITHUB_STEP_SUMMARY"
