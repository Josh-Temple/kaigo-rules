name: Kaigo Rules GitHub Pages site deployment
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/kaigo-pages-public-beta-main.yml"
      - "scripts/rewrite_public_navigation.py"
      - "scripts/community_staffing_reader.py"
      - "scripts/health_facility_staffing_reader.py"
      - "scripts/welfare_facility_staffing_reader.py"
      - "scripts/fee_version_labels.py"
      - "scripts/group_home_staffing_reader.py"
      - "scripts/preventive_group_home_staffing_reader.py"
      - "scripts/night_homevisit_manager_clarification.py"
      - "scripts/care_medical_staffing_reader.py"
      - "scripts/nursing_small_scale_roles_clarification.py"
      - "scripts/care_management_staffing_reader.py"
      - "scripts/dementia_dayservice_staffing_reader.py"
      - "scripts/preventive_dementia_dayservice_staffing_reader.py"
      - "scripts/homebath_staffing_reader.py"
      - "scripts/preventive_homebath_staffing_reader.py"
      - "scripts/community_facility_equipment_reader.py"
      - "scripts/prepare_handbook_publication_boundary.py"
      - "app/**"
      - "components/**"
      - "data/**"
      - "lib/**"
      - "experiments/**"
      - "scripts/build_github_pages_*.py"
      - "scripts/build_handbook_site.py"
      - "scripts/localize_github_pages_links_pilot.py"
      - "scripts/extract_database_search_snapshot.py"
      - "scripts/extract_qa_search_snapshot.py"
      - "scripts/qa_reader_site.mjs"
      - "scripts/prepare_github_pages_beta.py"
      - "scripts/finalize_github_pages_site.py"
      - "scripts/audit_github_pages_migration_readiness.py"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: kaigo-rules-pages-publication
  cancel-in-progress: false

jobs:
  package:
    name: Verify and package the public site with source warnings
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify publication navigation and branding
        run: |
          python -m unittest discover -s tests -p 'test_*navigation.py' -v
          python -m unittest \
            tests/test_fee_version_labels.py \
            tests/test_group_home_staffing_reader.py \
            tests/test_preventive_group_home_staffing_reader.py \
            tests/test_night_homevisit_manager_clarification.py \
            tests/test_care_medical_staffing_reader.py \
            tests/test_nursing_small_scale_roles_clarification.py \
            tests/test_care_management_staffing_reader.py \
            tests/test_dementia_dayservice_staffing_reader.py \
            tests/test_preventive_dementia_dayservice_staffing_reader.py \
            tests/test_homebath_staffing_reader.py \
            tests/test_preventive_homebath_staffing_reader.py \
            tests/test_community_facility_equipment_reader.py \
            tests/test_handbook_publication_boundary.py \
            tests/test_formal_site_display.py -v
      - name: Verify static-source and disclaimer safety tests
        run: |
          set -euo pipefail
          python -m unittest tests/test_github_pages_beta.py tests/test_github_pages_legislation_pilot.py tests/test_github_pages_migration_readiness.py
      - name: Verify original application build
        run: |
          set -euo pipefail
          python scripts/prepare_handbook_publication_boundary.py apply .
          npm ci
          npm run build
      - name: Build all generated handbook, Q&A and legislation pages
        env:
          KAIGO_RUN_STATIC_DETAILS: "1"
        run: |
          set -euo pipefail
          python scripts/build_github_pages_integrated_pilot.py --with-details > "$RUNNER_TEMP/pages-site-build.log"
      - name: Audit the exact candidate against measured safe bounds
        id: site
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python scripts/finalize_github_pages_site.py \
            --build-log "$RUNNER_TEMP/pages-site-build.log" \
            --source-sha "$SOURCE_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload verified public site (noindex remains)
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ steps.site.outputs.path }}

  deploy:
    name: Deploy primary GitHub Pages site (noindex remains)
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy generated site
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deploy
