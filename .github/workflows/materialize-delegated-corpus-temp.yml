name: Materialize delegated national corpus (temporary)

on:
  pull_request:
    paths:
      - "scripts/import_delegated_remuneration_national_corpus.py"
      - ".github/workflows/materialize-delegated-corpus-temp.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Materialize full registered-source corpus
        run: python scripts/import_delegated_remuneration_national_corpus.py
      - name: Commit generated corpus to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shared/remuneration-delegated/national-corpus.json
          if git diff --cached --quiet; then
            echo "Corpus already materialized"
            exit 0
          fi
          git commit -m "Materialize national delegated remuneration corpus"
          git push origin HEAD:"${GITHUB_HEAD_REF}"
