name: Regenerate next Rouki 25 publication metadata

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "data/services/**"
      - "data/product-value-metrics-v0.1.json"
      - "lib/notice-database.ts"
      - "scripts/build_verification_registry.py"
      - "scripts/build_product_value_snapshot.py"
      - "tests/**"
      - ".github/workflows/regenerate-next-rouki25-publication.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Regenerate derived service and verification metadata
        run: |
          python scripts/build_service_catalog.py
          python scripts/build_verification_registry.py
          python scripts/build_product_value_snapshot.py
      - name: Commit deterministic generated outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/services/catalog.generated.json \
            data/verification-registry.json \
            data/product-value-snapshot-v0.1.json
          if git diff --cached --quiet; then
            echo "generated outputs already current"
            exit 0
          fi
          git diff --cached --check
          git commit -m "Regenerate metadata for next notice publication wave"
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin HEAD:"${{ github.head_ref }}"
