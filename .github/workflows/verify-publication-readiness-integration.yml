name: Verify publication readiness integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Canonical regeneration pass
        run: |
          python scripts/build_relation_human_review_pilot.py
          python scripts/build_relation_human_review_batches.py
          python scripts/build_relation_human_review_decision_effects.py
          python scripts/validate_bounded_currentness_closure.py
          python scripts/build_verification_registry.py
          python scripts/build_database_coverage_matrix.py
          python scripts/build_publication_requirement_scoping.py
          python scripts/build_publication_readiness.py
          python scripts/build_bounded_publication_allowlist.py
          git diff --exit-code
      - name: Validate integrated readiness and bounded publication
        run: |
          python scripts/validate_relation_human_review_decisions.py
          python scripts/validate_publication_requirement_scoping.py
          python scripts/validate_publication_readiness.py
          python scripts/validate_bounded_publication_allowlist.py
          python -m unittest             tests.test_relation_human_review_expansion             tests.test_publication_requirement_scoping             tests.test_publication_readiness             tests.test_bounded_publication_allowlist             tests.test_human_review_bounded_publication_integration
