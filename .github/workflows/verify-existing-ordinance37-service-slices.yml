name: Verify existing Ordinance 37 service slices

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "data/ordinance37-nodes.json"
      - "data/ordinance37-relations.json"
      - "data/ordinance37-meta.json"
      - "data/ordinance37-scope.json"
      - "data/services/**/ordinance37-scope.json"
      - "data/services/homevisit/ordinance37-index.generated.json"
      - "scripts/verify_existing_ordinance37_service_slices.py"
      - ".github/workflows/verify-existing-ordinance37-service-slices.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Rebuild corrected homevisit index candidate
        run: python scripts/build_homevisit_ordinance37_index.py
      - name: Independently reparse live e-Gov service slices
        run: |
          python scripts/verify_existing_ordinance37_service_slices.py \
            --report existing-ordinance37-service-slices-verification.json
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: existing-ordinance37-service-slices-verification
          path: |
            existing-ordinance37-service-slices-verification.json
            data/services/homevisit/ordinance37-index.generated.json
          if-no-files-found: warn
          retention-days: 90
