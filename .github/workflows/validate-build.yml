name: Validate build

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "automation/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install PDF text extractor for independent source reparse
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Independently verify dayrehab remuneration and guidance source inventories
        run: python scripts/verify_dayrehab_fee_layers_independent.py --report /tmp/dayrehab-fee-layer-independent-report.json
      - name: Validate currentness evidence expansion boundaries
        run: python scripts/validate_currentness_evidence_expansion_wave.py
      - name: Verify public URL metadata and sitemap boundaries
        run: node --experimental-strip-types --test tests/public-seo.test.mjs
      - name: Validate and build
        run: npm run build
      - name: Compile production gate verifier
        run: python -m py_compile scripts/verify_field_validation_production.py

      - name: Smoke test key routes
        shell: bash
        run: |
          VERCEL_GIT_COMMIT_SHA="$GITHUB_SHA" VERCEL_GIT_COMMIT_REF="$GITHUB_REF_NAME" npm start > /tmp/kaigo-rules-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/kaigo-rules-next.log
            exit 1
          fi

          # Verify generated discovery endpoints on the built Next.js server.
          robots_body="$(curl --fail --silent --show-error http://127.0.0.1:3000/robots.txt)"
          grep -F 'Sitemap: https://kaigo-rules.vercel.app/sitemap.xml' <<< "$robots_body" >/dev/null || {
            echo "robots.txt is missing the canonical sitemap URL"
            exit 1
          }
          sitemap_body="$(curl --fail --silent --show-error http://127.0.0.1:3000/sitemap.xml)"
          grep -F '<loc>https://kaigo-rules.vercel.app/databases</loc>' <<< "$sitemap_body" >/dev/null || {
            echo "sitemap.xml does not expose the public database entry"
            exit 1
          }
          for route in "/" "/databases" "/services" "/law" "/rules" "/notices" "/qa"; do
            html="$(curl --fail --silent --show-error "http://127.0.0.1:3000$route")"
            canonical="https://kaigo-rules.vercel.app$route"
            grep -F "rel=\"canonical\" href=\"$canonical\"" <<< "$html" >/dev/null || {
              echo "Missing canonical URL for $route"
              exit 1
            }
          done
          search_html="$(curl --fail --silent --show-error 'http://127.0.0.1:3000/databases/search?q=BCP')"
          grep -F 'name="robots" content="noindex' <<< "$search_html" >/dev/null || {
            echo "Search result page must remain noindex"
            exit 1
          }

          routes=(
            "/"
            "/overview"
            "/databases"
            "/databases/search"
            "/search"
            "/api/version"
            "/start"
            "/qa"
            "/law"
            "/rules"
            "/rules/10"
            "/rules/93"
            "/rules/99"
            "/questions/nurse-staffing"
            "/api/context/services/dayservice/questions/nurse-staffing"
            "/notices"
            "/notices?service=homevisit"
            "/notices/review"
            "/fees"
            "/fees/guidance"
            "/fees/unit-price"
            "/sources"
            "/about"
            "/feedback"
            "/services/dayservice"
            "/services/dayrehab"
            "/services/dayrehab/remuneration"
            "/services/dayrehab/remuneration/guidance"
          )
          for route in "${routes[@]}"; do
            echo "GET $route"
            curl --fail --silent --show-error "http://127.0.0.1:3000$route" >/dev/null || {
              cat /tmp/kaigo-rules-next.log
              exit 1
            }
          done

          database_search_page="$(curl --fail --silent --show-error "http://127.0.0.1:3000/databases/search?q=BCP")"
          homevisit_database_search_page="$(curl --fail --silent --show-error --get --data-urlencode "q=訪問介護員" "http://127.0.0.1:3000/databases/search")"
          echo "$homevisit_database_search_page" | grep -F "訪問介護員等の員数" >/dev/null || {
            echo "global database search did not surface the published homevisit notice records"
            exit 1
          }
          echo "$homevisit_database_search_page" | grep -F "/notices?service=homevisit" >/dev/null || {
            echo "global database search did not preserve the homevisit notice destination"
            exit 1
          }

          echo "$database_search_page" | grep -F "業務継続計画" >/dev/null || {
            echo "global database search did not surface BCP-related shared records"
            exit 1
          }
          echo "$database_search_page" | grep -F "基準解釈通知" >/dev/null || {
            echo "global database search is missing the notice result section"
            exit 1
          }

          shared_status="$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:3000/rules/10)"
          if [ "$shared_status" != "200" ]; then
            echo "legitimate shared ordinance route was not available: /rules/10 ($shared_status)"
            exit 1
          fi

          global_exclusive_status="$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:3000/rules/18)"
          if [ "$global_exclusive_status" != "200" ]; then
            echo "shared-corpus ordinance route is unavailable globally: /rules/18 ($global_exclusive_status)"
            exit 1
          fi

          dayservice_exclusive_status="$(curl --silent --output /dev/null --write-out "%{http_code}" "http://127.0.0.1:3000/rules/18?service=dayservice")"
          if [ "$dayservice_exclusive_status" != "404" ]; then
            echo "homevisit-only ordinance route leaked into dayservice-filtered surface: /rules/18?service=dayservice ($dayservice_exclusive_status)"
            exit 1
          fi

          careact8_global_page="$(curl --fail --silent --show-error http://127.0.0.1:3000/law/8)"
          echo "$careact8_global_page" | grep -F 'この法律において「通所介護」とは' >/dev/null || {
            echo "dayservice Article 8 paragraph 7 is missing from global /law/8"
            exit 1
          }
          echo "$careact8_global_page" | grep -F 'この法律において「訪問介護」とは' >/dev/null || {
            echo "homevisit Article 8 paragraph 2 is missing from global /law/8"
            exit 1
          }

          careact8_dayservice_page="$(curl --fail --silent --show-error "http://127.0.0.1:3000/law/8?service=dayservice")"
          echo "$careact8_dayservice_page" | grep -F 'この法律において「通所介護」とは' >/dev/null || {
            echo "dayservice Article 8 paragraph 7 is missing from /law/8?service=dayservice"
            exit 1
          }
          if echo "$careact8_dayservice_page" | grep -F 'この法律において「訪問介護」とは' >/dev/null; then
            echo "homevisit Article 8 paragraph 2 leaked into /law/8?service=dayservice"
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:3000/overview \
            | grep -F "算定上の留意事項" >/dev/null || {
              echo "overview does not expose fee-guidance as a first-class source layer"
              exit 1
            }

          curl --fail --silent --show-error http://127.0.0.1:3000/overview \
            | grep -F "独立確認済み" >/dev/null || {
              echo "overview does not expose user-facing independent verification status"
              exit 1
            }

          verification_routes=(
            "/law"
            "/law/41"
            "/rules"
            "/rules/93"
            "/notices"
            "/notices?service=homevisit"
            "/fees"
            "/fees/standard"
            "/fees/criteria"
            "/fees/guidance"
            "/fees/unit-price"
            "/qa"
            "/services/dayrehab/remuneration"
            "/services/dayrehab/remuneration/guidance"
          )
          for route in "${verification_routes[@]}"; do
            if ! curl --fail --silent --show-error "http://127.0.0.1:3000$route" | grep -F "本文の独立確認" >/dev/null; then
              echo "verification summary missing from $route"
              exit 1
            fi
          done

          faq_page="$(curl --fail --silent --show-error http://127.0.0.1:3000/questions/nurse-staffing)"
          for route in "/services/dayrehab/remuneration" "/services/dayrehab/remuneration/guidance"; do
            page="$(curl --fail --silent --show-error "http://127.0.0.1:3000$route")"
            echo "$page" | grep -F "これは現行統合本文ではありません" >/dev/null || {
              echo "dayrehab fee route must disclose that it is not an integrated current text: $route"
              exit 1
            }
            echo "$page" | grep -F "本文の独立確認" >/dev/null || {
              echo "dayrehab fee route is missing verification summary: $route"
              exit 1
            }
          done

          shortstay_status="$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:3000/services/shortstay-life)"
          if [ "$shortstay_status" != "404" ]; then
            echo "shortstay-life unexpectedly became public: HTTP $shortstay_status"
            exit 1
          fi

          echo "$faq_page" | grep -F "FAQ根拠対応を確認済み" >/dev/null || {
            echo "FAQ verification scope label missing"
            exit 1
          }
          echo "$faq_page" | grep -F "根拠資料全体の確認状態は別です" >/dev/null || {
            echo "FAQ verification scope explanation missing"
            exit 1
          }
          echo "$faq_page" | grep -F "基準省令DBで現在の条文と確認状態を見る" >/dev/null || {
            echo "FAQ canonical ordinance link missing"
            exit 1
          }
          echo "$faq_page" | grep -F "解釈通知DBの再構成・現行性を見る" >/dev/null || {
            echo "FAQ notice currentness link missing"
            exit 1
          }

          field_validation_routes=(
            "/questions/manager-concurrent-role"
            "/questions/life-counselor-staffing"
            "/questions/nurse-staffing"
            "/questions/dining-training-area"
            "/questions/operation-rules-content"
            "/questions/important-matters-content"
            "/questions/care-plan-content"
            "/questions/care-plan-signature"
            "/questions/annual-training"
            "/questions/bcp-training"
          )
          for route in "${field_validation_routes[@]}"; do
            page="$(curl --fail --silent --show-error "http://127.0.0.1:3000$route")" || {
              echo "field validation route failed: $route"
              cat /tmp/kaigo-rules-next.log
              exit 1
            }
            echo "$page" | grep -F "FAQ根拠対応を確認済み" >/dev/null || {
              echo "field validation route is not verified: $route"
              exit 1
            }
            echo "$page" | grep -E "原文を確認|資料を確認|Q&A集を確認" >/dev/null || {
              echo "field validation route has no authoritative-source link: $route"
              exit 1
            }
          done

          if curl --fail --silent --show-error http://127.0.0.1:3000/rules/93 \
            | grep -F "看護職員は何人必要ですか？" >/dev/null; then
              echo "unverified FAQ relation leaked onto /rules/93"
              exit 1
            fi

          curl --fail --silent --show-error http://127.0.0.1:3000/api/context/services/dayservice/questions/nurse-staffing \
            | grep -F '"package_id":"dayservice.question.nurse-staffing"' >/dev/null || {
              echo "question context API did not return the expected package"
              exit 1
            }

          echo "Run Integration Sprint D4 black-box gate against local exact SHA"
          set +e
          python scripts/run_integration_sprint_release_regression.py \
            --base-url http://127.0.0.1:3000 \
            --expected-sha "$GITHUB_SHA" \
            --output /tmp/integration-sprint-release-regression.json
          d4_rc=$?
          set -e
          cat /tmp/integration-sprint-release-regression.json
          if [ "$d4_rc" -ne 0 ]; then
            exit "$d4_rc"
          fi

          echo "Run machine retrieval benchmark against local exact SHA"
          python scripts/run_machine_retrieval_benchmark.py \
            --base-url http://127.0.0.1:3000 \
            --expected-sha "$GITHUB_SHA" \
            --output /tmp/machine-retrieval-benchmark.json
          cat /tmp/machine-retrieval-benchmark.json

          python scripts/run_practical_navigation_regression.py \
            --base-url http://127.0.0.1:3000 --expected-sha "$GITHUB_SHA" \
            --output /tmp/practical-navigation.json
