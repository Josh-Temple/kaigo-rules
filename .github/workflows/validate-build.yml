name: Validate build

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "automation/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate and build
        run: npm run build
      - name: Smoke test key routes
        shell: bash
        run: |
          npm start > /tmp/kaigo-rules-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/kaigo-rules-next.log
            exit 1
          fi

          routes=(
            "/"
            "/overview"
            "/search"
            "/start"
            "/qa"
            "/law"
            "/rules"
            "/rules/93"
            "/rules/99"
            "/questions/nurse-staffing"
            "/api/context/services/dayservice/questions/nurse-staffing"
            "/notices"
            "/notices/review"
            "/fees"
            "/fees/guidance"
            "/fees/unit-price"
            "/sources"
            "/about"
            "/feedback"
          )
          for route in "${routes[@]}"; do
            echo "GET $route"
            curl --fail --silent --show-error "http://127.0.0.1:3000$route" >/dev/null || {
              cat /tmp/kaigo-rules-next.log
              exit 1
            }
          done

          curl --fail --silent --show-error http://127.0.0.1:3000/overview \
            | grep -F "算定上の留意事項" >/dev/null || {
              echo "overview does not expose fee-guidance as a first-class source layer"
              exit 1
            }

          curl --fail --silent --show-error http://127.0.0.1:3000/overview \
            | grep -F "独立確認済み" >/dev/null || {
              echo "overview does not expose user-facing independent verification status"
              exit 1
            }

          verification_routes=(
            "/law"
            "/law/41"
            "/rules"
            "/rules/93"
            "/notices"
            "/fees"
            "/fees/standard"
            "/fees/criteria"
            "/fees/guidance"
            "/fees/unit-price"
            "/qa"
          )
          for route in "${verification_routes[@]}"; do
            if ! curl --fail --silent --show-error "http://127.0.0.1:3000$route" | grep -F "本文の独立確認" >/dev/null; then
              echo "verification summary missing from $route"
              exit 1
            fi
          done

          faq_page="$(curl --fail --silent --show-error http://127.0.0.1:3000/questions/nurse-staffing)"
          echo "$faq_page" | grep -F "FAQ根拠対応を確認済み" >/dev/null || {
            echo "FAQ verification scope label missing"
            exit 1
          }
          echo "$faq_page" | grep -F "根拠資料全体の確認状態は別です" >/dev/null || {
            echo "FAQ verification scope explanation missing"
            exit 1
          }
          echo "$faq_page" | grep -F "基準省令DBで現在の条文と確認状態を見る" >/dev/null || {
            echo "FAQ canonical ordinance link missing"
            exit 1
          }
          echo "$faq_page" | grep -F "解釈通知DBの再構成・現行性を見る" >/dev/null || {
            echo "FAQ notice currentness link missing"
            exit 1
          }

          field_validation_routes=(
            "/questions/manager-concurrent-role"
            "/questions/life-counselor-staffing"
            "/questions/nurse-staffing"
            "/questions/dining-training-area"
            "/questions/operation-rules-content"
            "/questions/important-matters-content"
            "/questions/care-plan-content"
            "/questions/care-plan-signature"
            "/questions/annual-training"
            "/questions/bcp-training"
          )
          for route in "${field_validation_routes[@]}"; do
            page="$(curl --fail --silent --show-error "http://127.0.0.1:3000$route")" || {
              echo "field validation route failed: $route"
              cat /tmp/kaigo-rules-next.log
              exit 1
            }
            echo "$page" | grep -F "FAQ根拠対応を確認済み" >/dev/null || {
              echo "field validation route is not verified: $route"
              exit 1
            }
            echo "$page" | grep -E "原文を確認|資料を確認|Q&A集を確認" >/dev/null || {
              echo "field validation route has no authoritative-source link: $route"
              exit 1
            }
          done

          curl --fail --silent --show-error http://127.0.0.1:3000/rules/93 \
            | grep -F "看護職員は何人必要ですか？" >/dev/null || {
              echo "legacy FAQ relation ID was not normalized onto /rules/93"
              exit 1
            }

          curl --fail --silent --show-error http://127.0.0.1:3000/api/context/services/dayservice/questions/nurse-staffing \
            | grep -F '"package_id":"dayservice.question.nurse-staffing"' >/dev/null || {
              echo "question context API did not return the expected package"
              exit 1
            }
