name: One-shot exact-SHA production gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-national-source-assurance-release.yml"

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: e3a6c3f038293d962562429e5056f3e36c603191
      - name: Verify exact production SHA and field-validation gate
        run: |
          python scripts/verify_field_validation_production.py \
            --base-url https://kaigo-rules.vercel.app \
            --expected-sha e3a6c3f038293d962562429e5056f3e36c603191 \
            --wait-seconds 120 \
            --interval-seconds 10
      - name: Run machine retrieval benchmark
        run: |
          mkdir -p artifacts
          python scripts/run_machine_retrieval_benchmark.py \
            --base-url https://kaigo-rules.vercel.app \
            --expected-sha e3a6c3f038293d962562429e5056f3e36c603191 \
            --output artifacts/machine-retrieval-v0.1.json
      - name: Run integration release regression
        run: |
          python scripts/run_integration_sprint_release_regression.py \
            --base-url https://kaigo-rules.vercel.app \
            --expected-sha e3a6c3f038293d962562429e5056f3e36c603191 \
            --output artifacts/integration-release-regression.json
      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: national-source-assurance-release-e3a6c3f038293d962562429e5056f3e36c603191
          path: artifacts
          if-no-files-found: error
          retention-days: 90
      - name: Advance deploy-state only after all exact-SHA gates pass
        run: git push --force origin "HEAD:refs/heads/deploy-state/kaigo-rules"
