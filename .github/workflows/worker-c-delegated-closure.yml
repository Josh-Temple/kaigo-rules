name: Worker C delegated residual closure

on:
  push:
    branches:
      - work/delegated-remuneration-residual-closure

permissions:
  contents: write

jobs:
  regenerate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/delegated-remuneration-residual-closure
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Rebuild delegated national corpus
        run: python scripts/import_delegated_remuneration_national_corpus.py
      - name: Rebuild delegated shared projections
        run: python scripts/build_delegated_remuneration_shared_corpus.py
      - name: Validate delegated corpus
        run: |
          python scripts/import_delegated_remuneration_national_corpus.py --check
          python scripts/build_delegated_remuneration_shared_corpus.py --check
          python -m unittest tests.test_delegated_remuneration_national_corpus tests.test_delegated_remuneration_shared_corpus
      - name: Validate residual projection fail-closed
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          ROOT = Path.cwd()
          sys.path.insert(0, str(ROOT / "scripts"))
          import build_database_coverage_matrix as coverage
          matrix = coverage.build()
          residuals = {
              "homecaremanagement",
              "preventive-homecaremanagement",
              "preventive-welfare-equipment-rental",
          }
          seen = set()
          for service in matrix["services"]:
              if service["service_id"] not in residuals:
                  continue
              cell = next(
                  c for c in service["source_families"]
                  if c["source_family"] == "delegated_remuneration_criteria"
              )
              assert cell["service_applicability"]["state"] == "MAPPED", (service["service_id"], cell)
              assert cell["ingestion"]["state"] == "INGESTED", (service["service_id"], cell)
              assert cell["item_body_verification"]["state"] == "NOT_ESTABLISHED", (service["service_id"], cell)
              assert cell["currentness"]["state"] == "NOT_ESTABLISHED", (service["service_id"], cell)
              assert cell["relation_verification"]["state"] == "NOT_ESTABLISHED", (service["service_id"], cell)
              assert cell["human_review"]["state"] == "NOT_REVIEWED", (service["service_id"], cell)
              assert cell["publication"]["state"] == "BLOCKED", (service["service_id"], cell)
              assert cell["route_exposure"]["state"] == "BLOCKED", (service["service_id"], cell)
              seen.add(service["service_id"])
          assert seen == residuals, (seen, residuals)
          summary = matrix["summary"]["source_family_coverage"]["delegated_remuneration_criteria"]
          assert summary["ingestion"].get("INGESTED") == 37, summary
          assert summary["ingestion"].get("NOT_APPLICABLE") == 2, summary
          assert summary["ingestion"].get("NOT_INGESTED", 0) == 0, summary
          PY
      - name: Run related source-chain validations
        run: |
          python scripts/validate_remuneration_delegation_relation_independent_audit.py
          python scripts/validate_cross_layer_source_chain_independent_audit.py
      - name: Commit family-local generated artifacts
        shell: bash
        run: |
          if git diff --quiet -- \
            data/shared/remuneration-delegated/national-corpus.json \
            data/shared/remuneration-delegated/manifest.json \
            data/shared/remuneration-delegated/node-identity-map.json \
            data/shared/remuneration-delegated/service-applicability.json \
            data/shared/remuneration-delegated/service-relations.json; then
            echo "No delegated generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/shared/remuneration-delegated/national-corpus.json \
            data/shared/remuneration-delegated/manifest.json \
            data/shared/remuneration-delegated/node-identity-map.json \
            data/shared/remuneration-delegated/service-applicability.json \
            data/shared/remuneration-delegated/service-relations.json
          git commit -m "Worker C: regenerate delegated residual closure"
          git push origin HEAD:work/delegated-remuneration-residual-closure
