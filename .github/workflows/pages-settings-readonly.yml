name: Read-only Pages hosting configuration check
on:
  push:
    branches: ["audit/20261102-pages-hosting-settings"]
permissions:
  contents: read
  pages: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect GitHub Pages settings without making changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --location --output "$RUNNER_TEMP/pages-config.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/pages")
          if [ "$code" = 200 ]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          obj=json.loads((Path(os.environ["RUNNER_TEMP"])/"pages-config.json").read_text())
          print("PAGES_STATUS: enabled")
          print("PAGES_BUILD_TYPE:", obj.get("build_type", "unknown"))
          print("PAGES_BUILD_SOURCE:", obj.get("source", {}))
          print("PAGES_SOURCE_BRANCH:", (obj.get("source") or {}).get("branch", "unknown"))
          print("PAGES_SOURCE_PATH:", (obj.get("source") or {}).get("path", "unknown"))
          print("PAGES_PUBLISH_STATUS:", obj.get("status", "unknown"))
          print("PAGES_HTTPS_ENFORCED:", bool(obj.get("https_enforced", False)))
          print("PAGES_URL:", obj.get("html_url", "not-returned"))
          PY
          elif [ "$code" = 404 ]; then
            echo "PAGES_STATUS: not-enabled-or-not-visible-to-connection"
          elif [ "$code" = 403 ]; then
            echo "PAGES_STATUS: permissions-insufficient-to-check"
          else
            echo "PAGES_STATUS: API returned HTTP $code"
          fi
          echo "PAGES_HOME_HTTP: $(curl -L --silent --output /dev/null --max-time 20 --write-out '%{http_code}' 'https://josh-temple.github.io/kaigo-rules/' || true)"
          for route in services/dayservice/index.html handbook/dayservice/staffing.html databases/search/index.html; do
            status=$(curl -L --silent --output /dev/null --max-time 20 --write-out '%{http_code}' "https://josh-temple.github.io/kaigo-rules/$route" || true)
            echo "PAGES_ROUTE_HTTP: $route $status"
          done

          for env_name in github-pages; do
            env_code=$(curl --silent --show-error --location --output "$RUNNER_TEMP/environment.json" --write-out '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/environments/$env_name")
            echo "PAGES_ENV_POLICY_HTTP: $env_code"
            if [ "$env_code" = "200" ]; then
              python - <<'PY'
          import json, os
          from pathlib import Path
          item=json.loads((Path(os.environ["RUNNER_TEMP"])/"environment.json").read_text())
          print("PAGES_ENV_NAME:",item.get("name"))
          print("PAGES_ENV_BRANCH_POLICY:",item.get("deployment_branch_policy"))
          print("PAGES_ENV_RULE_TYPES:",[x.get("type") for x in item.get("protection_rules",[])])
          PY
            fi
          done
