name: Verify Kaigo Ops Analytics A

on:
  pull_request:
    paths:
      - ".github/workflows/verify-kaigo-ops-analytics-a.yml"
      - "ops-site/**"
      - "docs/kaigo-ops/measurement.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytics-send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ops-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Check Analytics script delivery directly
        shell: bash
        run: |
          code="$(curl --silent --show-error --location --output /tmp/analytics-script.js --write-out '%{http_code}' https://ops-site-pi.vercel.app/_vercel/insights/script.js || true)"
          echo "DIRECT_ANALYTICS_SCRIPT_HTTP_STATUS=$code"
          test "$code" = "200"
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Diagnose production Analytics browser send
        shell: bash
        run: |
          cat > verify-analytics.tmp.mjs <<'EOF'
          import { chromium } from 'playwright';

          const base = 'https://ops-site-pi.vercel.app';
          const routes = ['/', '/issues/information-search'];
          const analytics = [];
          const failures = [];

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });

          page.on('request', request => {
            if (request.url().includes('/_vercel/insights/')) {
              analytics.push({ kind: 'request', method: request.method(), url: request.url() });
              console.log('ANALYTICS_REQUEST', request.method(), request.url());
            }
          });

          page.on('response', response => {
            if (response.url().includes('/_vercel/insights/')) {
              analytics.push({ kind: 'response', status: response.status(), url: response.url() });
              console.log('ANALYTICS_RESPONSE', response.status(), response.url());
            }
          });

          page.on('requestfailed', request => {
            if (request.url().includes('/_vercel/insights/')) {
              failures.push({ url: request.url(), error: request.failure()?.errorText ?? 'unknown' });
              console.log('ANALYTICS_REQUEST_FAILED', request.url(), request.failure()?.errorText ?? 'unknown');
            }
          });

          page.on('pageerror', error => console.log('PAGE_ERROR', error.message));

          for (const route of routes) {
            const response = await page.goto(base + route, { waitUntil: 'networkidle' });
            if (!response || !response.ok()) throw new Error(route + ': HTTP ' + (response?.status() ?? 'no response'));
            await page.waitForTimeout(2500);

            const scriptSrcs = await page.locator('script[src]').evaluateAll(nodes =>
              nodes.map(node => node.getAttribute('src')).filter(Boolean)
            );
            const resourceNames = await page.evaluate(() =>
              performance.getEntriesByType('resource').map(entry => entry.name)
            );

            console.log('CONTROLLED_ROUTE', route);
            console.log('SCRIPT_SRCS', JSON.stringify(scriptSrcs));
            console.log('INSIGHTS_RESOURCES', JSON.stringify(resourceNames.filter(name => name.includes('/_vercel/insights/'))));
          }

          await page.waitForTimeout(3000);
          await browser.close();

          const scriptResponse = analytics.some(
            item => item.kind === 'response' && item.status === 200 && item.url.includes('/_vercel/insights/script.js')
          );
          const viewRequest = analytics.some(
            item => item.kind === 'request' && item.url.includes('/_vercel/insights/view')
          );

          console.log('BROWSER_ANALYTICS_SCRIPT_200=' + scriptResponse);
          console.log('BROWSER_ANALYTICS_VIEW_REQUEST=' + viewRequest);
          console.log('BROWSER_ANALYTICS_FAILED_REQUESTS=' + failures.length);
          EOF
          node verify-analytics.tmp.mjs
          rm -f verify-analytics.tmp.mjs
