name: Verify Kaigo Ops Analytics A

on:
  pull_request:
    paths:
      - ".github/workflows/verify-kaigo-ops-analytics-a.yml"
      - "ops-site/**"
      - "docs/kaigo-ops/measurement.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytics-send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ops-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Check Analytics compatibility script delivery
        shell: bash
        run: |
          code="$(curl --silent --show-error --location --output /tmp/analytics-script.js --write-out '%{http_code}' https://ops-site-pi.vercel.app/_vercel/insights/script.js || true)"
          echo "COMPAT_ANALYTICS_SCRIPT_HTTP_STATUS=$code"
          test "$code" = "200"
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify controlled browser pageview send
        shell: bash
        run: |
          cat > verify-analytics.tmp.mjs <<'EOF'
          import { chromium } from 'playwright';

          const base = 'https://ops-site-pi.vercel.app';
          const route = '/issues/information-search';
          const traffic = [];
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 390, height: 844 },
            userAgent: 'Mozilla/5.0 (Linux; Android 16; Pixel 9) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36',
          });
          const page = await context.newPage();

          page.on('request', request => {
            traffic.push({
              kind: 'request',
              method: request.method(),
              resourceType: request.resourceType(),
              url: request.url(),
            });
          });
          page.on('response', response => {
            traffic.push({
              kind: 'response',
              status: response.status(),
              url: response.url(),
            });
          });
          page.on('pageerror', error => console.log('PAGE_ERROR', error.message));

          const response = await page.goto(base + route, { waitUntil: 'networkidle' });
          if (!response || !response.ok()) throw new Error(route + ': HTTP ' + (response?.status() ?? 'no response'));
          await page.waitForTimeout(2500);

          const script = await page.locator('script[src]').evaluateAll(nodes =>
            nodes
              .map(node => ({ src: node.getAttribute('src'), html: node.outerHTML }))
              .find(item => item.src && item.src.endsWith('/script.js') && !item.src.includes('/_next/')) ?? null
          );
          if (!script?.src) throw new Error('Analytics script tag was not found');

          console.log('CONTROLLED_ROUTE', route);
          console.log('USER_AGENT', await page.evaluate(() => navigator.userAgent));
          console.log('ANALYTICS_SCRIPT_TAG', JSON.stringify(script));
          console.log('VA_STATE_BEFORE', JSON.stringify(await page.evaluate(() => ({
            vaType: typeof window.va,
            vaq: Array.isArray(window.vaq) ? window.vaq : null,
            mode: window.vam ?? null,
          }))));

          await page.evaluate(({ route }) => {
            if (typeof window.va !== 'function') throw new Error('window.va is not available');
            window.va('pageview', { route, path: route });
          }, { route });
          console.log('CONTROLLED_PAGEVIEW_CALL', route);
          await page.waitForTimeout(5000);

          console.log('VA_STATE_AFTER', JSON.stringify(await page.evaluate(() => ({
            vaType: typeof window.va,
            vaq: Array.isArray(window.vaq) ? window.vaq : null,
            mode: window.vam ?? null,
          }))));

          await context.close();
          await browser.close();

          const prefix = new URL(script.src, base).pathname.replace(/script\.js$/, '');
          const dynamicTraffic = traffic.filter(item => {
            try {
              return new URL(item.url).pathname.startsWith(prefix);
            } catch {
              return false;
            }
          });

          for (const item of dynamicTraffic) {
            console.log('ANALYTICS_DYNAMIC_TRAFFIC', JSON.stringify(item));
          }

          const script200 = dynamicTraffic.some(
            item => item.kind === 'response' && item.status === 200 && item.url.endsWith('/script.js')
          );
          const viewRequests = dynamicTraffic.filter(
            item => item.kind === 'request' && new URL(item.url).pathname === prefix + 'view'
          );
          const viewResponses = dynamicTraffic.filter(
            item => item.kind === 'response' && new URL(item.url).pathname === prefix + 'view'
          );

          console.log('DYNAMIC_ANALYTICS_SCRIPT_200=' + script200);
          console.log('DYNAMIC_ANALYTICS_VIEW_REQUESTS=' + JSON.stringify(viewRequests));
          console.log('DYNAMIC_ANALYTICS_VIEW_RESPONSES=' + JSON.stringify(viewResponses));

          if (!script200) throw new Error('Dynamic Analytics script did not return HTTP 200');
          if (!viewRequests.length) throw new Error('Controlled Analytics view request was not observed');
          if (!viewResponses.some(item => item.status >= 200 && item.status < 300)) {
            throw new Error('Controlled Analytics view did not receive a successful response');
          }
          EOF
          node verify-analytics.tmp.mjs
          rm -f verify-analytics.tmp.mjs
