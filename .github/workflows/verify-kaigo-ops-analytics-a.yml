name: Verify Kaigo Ops Analytics A

on:
  pull_request:
    paths:
      - ".github/workflows/verify-kaigo-ops-analytics-a.yml"
      - "ops-site/**"
      - "docs/kaigo-ops/measurement.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytics-send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ops-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Check Analytics compatibility script delivery
        shell: bash
        run: |
          code="$(curl --silent --show-error --location --output /tmp/analytics-script.js --write-out '%{http_code}' https://ops-site-pi.vercel.app/_vercel/insights/script.js || true)"
          echo "COMPAT_ANALYTICS_SCRIPT_HTTP_STATUS=$code"
          test "$code" = "200"
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify production Analytics dynamic browser send
        shell: bash
        run: |
          cat > verify-analytics.tmp.mjs <<'EOF'
          import { chromium } from 'playwright';

          const base = 'https://ops-site-pi.vercel.app';
          const routes = ['/', '/issues/information-search'];
          const traffic = [];
          const failures = [];

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });

          page.on('request', request => {
            traffic.push({
              kind: 'request',
              method: request.method(),
              resourceType: request.resourceType(),
              url: request.url(),
            });
          });
          page.on('response', response => {
            traffic.push({
              kind: 'response',
              status: response.status(),
              url: response.url(),
            });
          });
          page.on('requestfailed', request => {
            failures.push({
              url: request.url(),
              error: request.failure()?.errorText ?? 'unknown',
            });
          });
          page.on('pageerror', error => console.log('PAGE_ERROR', error.message));

          for (const route of routes) {
            const response = await page.goto(base + route, { waitUntil: 'networkidle' });
            if (!response || !response.ok()) throw new Error(route + ': HTTP ' + (response?.status() ?? 'no response'));
            await page.waitForTimeout(2500);

            const analyticsScripts = await page.locator('script[src]').evaluateAll(nodes =>
              nodes
                .map(node => ({ src: node.getAttribute('src'), html: node.outerHTML }))
                .filter(item => item.src && item.src.endsWith('/script.js') && !item.src.includes('/_next/'))
            );
            console.log('CONTROLLED_ROUTE', route);
            console.log('ANALYTICS_SCRIPT_TAGS', JSON.stringify(analyticsScripts));
          }

          await page.waitForTimeout(3000);
          await browser.close();

          const dynamicScriptRequests = traffic.filter(item =>
            item.kind === 'request' &&
            item.resourceType === 'script' &&
            item.url.endsWith('/script.js') &&
            !item.url.includes('/_next/')
          );
          const prefixes = dynamicScriptRequests.map(item => new URL(item.url).pathname.replace(/script\.js$/, ''));
          const dynamicTraffic = traffic.filter(item => {
            try {
              const pathname = new URL(item.url).pathname;
              return prefixes.some(prefix => pathname.startsWith(prefix));
            } catch {
              return false;
            }
          });

          for (const item of dynamicTraffic) {
            console.log('ANALYTICS_DYNAMIC_TRAFFIC', JSON.stringify(item));
          }

          const dynamicScript200 = dynamicTraffic.some(
            item => item.kind === 'response' && item.status === 200 && item.url.endsWith('/script.js')
          );
          const pageviewSend = dynamicTraffic.some(
            item => item.kind === 'request' &&
            item.method === 'POST' &&
            !item.url.endsWith('/script.js')
          );

          console.log('DYNAMIC_ANALYTICS_SCRIPT_200=' + dynamicScript200);
          console.log('DYNAMIC_ANALYTICS_PAGEVIEW_SEND=' + pageviewSend);
          console.log('ANALYTICS_FAILED_REQUESTS=' + failures.filter(item => prefixes.some(prefix => {
            try { return new URL(item.url).pathname.startsWith(prefix); } catch { return false; }
          })).length);

          if (!dynamicScript200) throw new Error('Dynamic Analytics script did not return HTTP 200');
          if (!pageviewSend) throw new Error('Dynamic Analytics pageview POST was not observed');
          EOF
          node verify-analytics.tmp.mjs
          rm -f verify-analytics.tmp.mjs
