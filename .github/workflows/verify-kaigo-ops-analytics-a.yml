name: Inspect Kaigo Ops Analytics Intake A

on:
  pull_request:
    paths:
      - ".github/workflows/verify-kaigo-ops-analytics-a.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect deployed Analytics script
        shell: bash
        run: |
          curl --fail --silent --show-error --location             https://ops-site-pi.vercel.app/f130755abdc7617b/script.js             -o /tmp/analytics-script.js
          echo "SCRIPT_BYTES=$(wc -c < /tmp/analytics-script.js)"
          echo "SCRIPT_SHA256=$(sha256sum /tmp/analytics-script.js | awk '{print $1}')"
          echo "MATCHES_BEGIN"
          grep -Eio '.{0,100}(webdriver|headless|useragent|bot|automation|vaq|pageview).{0,140}' /tmp/analytics-script.js | head -80 || true
          echo "MATCHES_END"
