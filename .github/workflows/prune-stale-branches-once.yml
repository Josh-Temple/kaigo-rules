BRANCHES

          checked=0
          present=0
          while IFS='|' read -r branch expected reason; do
            [ -n "$branch" ] || continue
            actual="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
            if [ -z "$actual" ]; then
              echo "already absent: $branch ($reason)"
              continue
            fi
            if [ "$actual" != "$expected" ]; then
              echo "::error::Branch moved; refusing cleanup: $branch expected=$expected actual=$actual"
              exit 1
            fi
            checked=$((checked + 1))
            present=$((present + 1))
          done < /tmp/stale-branches.txt

          echo "Preflight PASS: $checked unchanged stale branches."

          deleted=0
          while IFS='|' read -r branch expected reason; do
            [ -n "$branch" ] || continue
            actual="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
            if [ -z "$actual" ]; then
              continue
            fi
            if [ "$actual" != "$expected" ]; then
              echo "::error::Branch moved after preflight; refusing deletion: $branch"
              exit 1
            fi
            git push origin --delete "$branch"
            deleted=$((deleted + 1))
            echo "deleted: $branch ($reason)"
          done < /tmp/stale-branches.txt

          {
            echo "## Stale branch cleanup"
            echo ""
            echo "- verified candidates: $checked"
            echo "- deleted: $deleted"
            echo "- safety: exact branch name + exact pre-recorded SHA required"
          } >> "$GITHUB_STEP_SUMMARY"
