name: Prepare shortstay-life Rouki 25 historical ingestion

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "data/services/shortstay-life/rouki25-scope.json"
      - "scripts/import_rouki25_historical_service.py"
      - "scripts/verify_rouki25_historical_service_independent.py"
      - "scripts/pin_rouki25_historical_service_audit.py"
      - "tests/test_shortstay_life_rouki25_ingestion.py"
      - ".github/workflows/prepare-shortstay-life-rouki25-historical.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Detect already-pinned dataset
        id: pinned
        shell: bash
        run: |
          if [[ -f data/shortstay-life-rouki25-historical-independent-audit.json \
             && -f data/services/shortstay-life/rouki25-historical.generated.json ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and independently verify bounded historical dataset
        if: steps.pinned.outputs.skip != 'true'
        shell: bash
        env:
          AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AUDIT_RUN_ID: ${{ github.run_id }}
          AUDIT_WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          report="shortstay-life-rouki25-independent-report.json"
          python scripts/import_rouki25_historical_service.py --service-id shortstay-life
          python scripts/verify_rouki25_historical_service_independent.py \
            --service-id shortstay-life \
            --report "$report"
          python scripts/pin_rouki25_historical_service_audit.py \
            --service-id shortstay-life \
            --expected-items 34 \
            --report "$report" \
            --run-id "$AUDIT_RUN_ID" \
            --head-sha "$AUDIT_HEAD_SHA" \
            --workflow "$AUDIT_WORKFLOW"
      - name: Validate pinned receipt
        if: steps.pinned.outputs.skip != 'true'
        run: python scripts/validate_rouki25_historical_service_audit.py --service-id shortstay-life --expected-items 34
      - name: Commit verified dataset and audit receipt
        if: steps.pinned.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/services/shortstay-life/rouki25-historical.generated.json \
            data/shortstay-life-rouki25-historical-independent-audit.json
          git diff --cached --check
          git commit -m "Materialize verified shortstay-life Rouki 25 dataset"
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin HEAD:"${{ github.head_ref }}"
