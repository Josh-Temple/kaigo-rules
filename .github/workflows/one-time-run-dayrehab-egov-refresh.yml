name: One-time dayrehab e-Gov branch refresh
# one-time trigger: 2026-10-01

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-run-dayrehab-egov-refresh.yml"

permissions:
  contents: write

jobs:
  refresh-feature-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: feature/dayrehab-egov-full-text
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Capture feature branch input SHA
        run: echo "FEATURE_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Rebuild shared Ordinance 37 corpus from live e-Gov
        run: python scripts/import_egov_ordinance37.py

      - name: Refresh scoped Care Insurance Act corpus from live e-Gov
        run: python scripts/import_egov_care_insurance_act.py

      - name: Rebuild shared-corpus service indexes
        run: |
          python scripts/build_homevisit_careact_index.py
          python scripts/build_homevisit_ordinance37_index.py
          python scripts/build_dayrehab_ordinance37_index.py

      - name: Independently reparse dayrehab scope
        run: |
          mkdir -p artifacts
          python scripts/verify_dayrehab_ordinance37_independent.py \
            --report artifacts/dayrehab-ordinance37-verification.json

      - name: Pin independent audit record
        run: |
          python scripts/build_dayrehab_ordinance37_audit.py \
            --verification-report artifacts/dayrehab-ordinance37-verification.json \
            --run-id "$GITHUB_RUN_ID" \
            --head-sha "$FEATURE_HEAD_SHA"
          python scripts/validate_dayrehab_ordinance37_independent_audit.py

      - name: Independently reparse the full scoped e-Gov corpus
        run: |
          python scripts/verify_egov_content_independent.py \
            --report artifacts/egov-content-independent-verification.json
          python scripts/build_egov_content_independent_audit.py \
            --verification-report artifacts/egov-content-independent-verification.json \
            --run-id "$GITHUB_RUN_ID" \
            --head-sha "$FEATURE_HEAD_SHA"
          python scripts/validate_egov_content_independent_audit.py

      - name: Refresh explicit legal-reference relation audit
        run: |
          python scripts/verify_relation_semantics_independent.py \
            --report artifacts/relation-semantic-independent-verification.json
          python scripts/build_relation_semantic_independent_audit.py \
            --verification-report artifacts/relation-semantic-independent-verification.json \
            --run-id "$GITHUB_RUN_ID" \
            --head-sha "$FEATURE_HEAD_SHA"
          python scripts/validate_relation_semantic_independent_audit.py

      - name: Refresh Care Act internal relation audit
        run: |
          python scripts/verify_careact_internal_relations_independent.py \
            --report artifacts/careact-internal-relation-independent-verification.json
          python scripts/build_careact_internal_relation_independent_audit.py \
            --verification-report artifacts/careact-internal-relation-independent-verification.json \
            --run-id "$GITHUB_RUN_ID" \
            --head-sha "$FEATURE_HEAD_SHA"
          python scripts/validate_careact_internal_relation_independent_audit.py

      - name: Refresh cross-layer source-chain audit
        run: |
          python scripts/verify_cross_layer_source_chains_independent.py \
            --report artifacts/cross-layer-source-chain-independent-verification.json
          python scripts/build_cross_layer_source_chain_independent_audit.py \
            --verification-report artifacts/cross-layer-source-chain-independent-verification.json \
            --run-id "$GITHUB_RUN_ID" \
            --head-sha "$FEATURE_HEAD_SHA"
          python scripts/validate_cross_layer_source_chain_independent_audit.py

      - name: Refresh remuneration delegation relation audit
        run: |
          python scripts/verify_remuneration_delegation_relations.py \
            --report artifacts/remuneration-delegation-independent-verification.json
          python scripts/build_remuneration_delegation_relation_independent_audit.py \
            --verification-report artifacts/remuneration-delegation-independent-verification.json \
            --run-id "$GITHUB_RUN_ID" \
            --head-sha "$FEATURE_HEAD_SHA"
          python scripts/validate_remuneration_delegation_relation_independent_audit.py

      - name: Rebuild derived service and product state
        run: |
          python scripts/build_service_catalog.py
          python scripts/build_verification_registry.py
          python scripts/build_product_value_snapshot.py

      - name: Commit generated canonical data to feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/ordinance37-nodes.json \
            data/ordinance37-relations.json \
            data/ordinance37-application-rules.json \
            data/ordinance37-meta.json \
            data/services/homevisit/care-insurance-act-index.generated.json \
            data/services/homevisit/ordinance37-index.generated.json \
            data/services/dayrehab/ordinance37-index.generated.json \
            data/dayrehab-ordinance37-independent-audit.json \
            data/egov-content-independent-audit.json \
            data/relation-semantic-independent-audit.json \
            data/careact-internal-relation-independent-audit.json \
            data/cross-layer-source-chain-independent-audit.json \
            data/remuneration-delegation-relation-independent-audit.json \
            data/care-insurance-act-nodes.json \
            data/care-insurance-act-relations.json \
            data/care-insurance-act-meta.json \
            data/services/catalog.generated.json \
            data/verification-registry.json \
            data/product-value-snapshot-v0.1.json
          git commit -m "Refresh shared Ordinance 37 corpus for dayrehab"
          git push origin HEAD:feature/dayrehab-egov-full-text

      - name: Upload verification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dayrehab-ordinance37-verification
          path: |
            artifacts/dayrehab-ordinance37-verification.json
            artifacts/egov-content-independent-verification.json
            artifacts/relation-semantic-independent-verification.json
            artifacts/careact-internal-relation-independent-verification.json
            artifacts/cross-layer-source-chain-independent-verification.json
            artifacts/remuneration-delegation-independent-verification.json
          if-no-files-found: error
          retention-days: 90
