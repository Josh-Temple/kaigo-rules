name: One-time dayrehab e-Gov branch refresh
# one-time trigger: 2026-10-01

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-run-dayrehab-egov-refresh.yml"

permissions:
  contents: write

jobs:
  refresh-feature-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: feature/dayrehab-egov-full-text
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Rebuild shared Ordinance 37 corpus from live e-Gov
        run: python scripts/import_egov_ordinance37.py

      - name: Build dayrehab shared-corpus index
        run: python scripts/build_dayrehab_ordinance37_index.py

      - name: Independently reparse dayrehab scope
        run: |
          mkdir -p artifacts
          python scripts/verify_dayrehab_ordinance37_independent.py \
            --report artifacts/dayrehab-ordinance37-verification.json

      - name: Pin independent audit record
        run: |
          python scripts/build_dayrehab_ordinance37_audit.py \
            --verification-report artifacts/dayrehab-ordinance37-verification.json \
            --run-id "$GITHUB_RUN_ID" \
            --head-sha "$GITHUB_SHA"
          python scripts/validate_dayrehab_ordinance37_independent_audit.py

      - name: Commit generated canonical data to feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/ordinance37-nodes.json \
            data/ordinance37-relations.json \
            data/ordinance37-application-rules.json \
            data/ordinance37-meta.json \
            data/services/dayrehab/ordinance37-index.generated.json \
            data/dayrehab-ordinance37-independent-audit.json
          git commit -m "Refresh shared Ordinance 37 corpus for dayrehab"
          git push origin HEAD:feature/dayrehab-egov-full-text

      - name: Upload verification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dayrehab-ordinance37-verification
          path: artifacts/dayrehab-ordinance37-verification.json
          if-no-files-found: error
          retention-days: 90
