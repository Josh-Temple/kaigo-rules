name: Worker E restore bytecode baseline

on:
  push:
    branches:
      - integration/ready-publication-currentness-expansion-wave-e-20261007

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - name: Restore tracked bytecode to release base
        run: |
          git checkout 29c5529be51a1211e060acd5911a1122aa0eaf0e -- scripts/__pycache__ tests/__pycache__
      - name: Commit baseline restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/__pycache__ tests/__pycache__
          if git diff --cached --quiet; then
            echo "Bytecode already matches release base."
          else
            git commit -m "[Worker E] Restore tracked bytecode to release base"
            git push origin HEAD:integration/ready-publication-currentness-expansion-wave-e-20261007
          fi
