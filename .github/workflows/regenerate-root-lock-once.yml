name: Regenerate root package lock once

on:
  push:
    branches:
      - chore/fresh-types-updates-20260924
    paths:
      - "package.json"
      - ".github/workflows/regenerate-root-lock-once.yml"

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/fresh-types-updates-20260924
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify npm ci accepts regenerated lockfile
        run: npm ci --ignore-scripts
      - name: Commit regenerated lockfile through GitHub Contents API
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          lock_sha="$(git rev-parse HEAD:package-lock.json)"
          content="$(base64 -w0 package-lock.json)"
          python - "$lock_sha" "$content" > /tmp/update-lock.json <<'PY'
          import json, sys
          sha, content = sys.argv[1], sys.argv[2]
          print(json.dumps({
              "message": "Regenerate package lock for type updates",
              "content": content,
              "sha": sha,
              "branch": "chore/fresh-types-updates-20260924",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPOSITORY/contents/package-lock.json" \
            --data-binary @/tmp/update-lock.json
