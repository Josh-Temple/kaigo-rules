name: Regenerate root package lock once

on:
  push:
    branches:
      - chore/fresh-types-updates-20260924
    paths:
      - "package.json"
      - ".github/workflows/regenerate-root-lock-once.yml"

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/fresh-types-updates-20260924
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify npm ci accepts regenerated lockfile
        run: npm ci --ignore-scripts
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regenerated-root-package-lock
          path: package-lock.json
          if-no-files-found: error
