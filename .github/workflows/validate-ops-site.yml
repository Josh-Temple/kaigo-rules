name: Validate ops site

on:
  pull_request:
    paths:
      - "ops-site/**"
      - ".github/workflows/validate-ops-site.yml"
  push:
    branches:
      - main
    paths:
      - "ops-site/**"
      - ".github/workflows/validate-ops-site.yml"

concurrency:
  group: validate-ops-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ops-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Install pinned browser test tooling
        run: |
          # Install before building: npm install can invalidate generated Next.js output.
          # Browser-only dependency; do not change the production dependency lockfile.
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - run: npm run build
      - name: Exercise all five tools in Chromium
        run: npm run test:browser
      - name: Smoke test key ops routes
        shell: bash
        run: |
          npm start > /tmp/kaigo-ops-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/kaigo-ops-next.log
            exit 1
          fi

          npm run verify:routes
