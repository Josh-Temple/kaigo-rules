name: Verify cross-layer source chains independently

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"
  pull_request:
    paths:
      - "scripts/verify_cross_layer_source_chains_independent.py"
      - "data/care-insurance-act-relations.json"
      - "data/care-insurance-act-nodes.json"
      - "data/ordinance37-meta.json"
      - "data/ordinance37-scope.json"
      - "data/remuneration-current-skeleton.json"
      - "data/sources.json"
      - ".github/workflows/verify-cross-layer-source-chains-independent.yml"
      - "data/cross-layer-source-chain-independent-audit.json"
      - "scripts/validate_cross_layer_source_chain_independent_audit.py"
  push:
    branches: [main]
    paths:
      - "scripts/verify_cross_layer_source_chains_independent.py"
      - "data/care-insurance-act-relations.json"
      - "data/care-insurance-act-nodes.json"
      - "data/ordinance37-meta.json"
      - "data/ordinance37-scope.json"
      - "data/remuneration-current-skeleton.json"
      - "data/sources.json"
      - ".github/workflows/verify-cross-layer-source-chains-independent.yml"
      - "data/cross-layer-source-chain-independent-audit.json"
      - "scripts/validate_cross_layer_source_chain_independent_audit.py"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Independently verify cross-layer source chains
        id: verify
        shell: bash
        run: |
          set +e
          python scripts/verify_cross_layer_source_chains_independent.py --report cross-layer-source-chain-independent-verification.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Validate pinned audit provenance
        run: python scripts/validate_cross_layer_source_chain_independent_audit.py
      - name: Upload independent source-chain report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-layer-source-chain-independent-verification
          path: cross-layer-source-chain-independent-verification.json
          if-no-files-found: warn
      - name: Fail on source-chain differences
        if: steps.verify.outputs.exit_code != '0'
        run: exit 1
