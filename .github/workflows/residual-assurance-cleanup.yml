name: Residual assurance cleanup

on:
  push:
    branches:
      - "work/residual-assurance-human-review-integrator-v2"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Remove transient Python bytecode and cleanup workflow
        run: |
          set -euo pipefail
          find scripts tests -type d -name __pycache__ -prune -exec rm -rf {} +
          find scripts tests -type f -name '*.pyc' -delete
          rm -f ".github/workflows/residual-assurance-cleanup.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[cleanup] Remove transient Python bytecode"
          git push origin "HEAD:work/residual-assurance-human-review-integrator-v2"
