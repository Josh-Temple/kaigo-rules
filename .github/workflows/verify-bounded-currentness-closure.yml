name: Verify bounded currentness closure

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "data/verification/bounded-currentness-closure-worker-b.json"
      - "scripts/validate_bounded_currentness_closure.py"
      - "scripts/validate_public_value_currentness_impact.py"
      - "scripts/verify_residual_ordinance37_service_slices.py"
      - "tests/test_bounded_currentness_closure.py"
      - "data/verification/shared-source-currentness-activation.json"
      - "data/verification/existing-ordinance37-service-slices-independent-audit.json"
      - "data/shared/standards/independent-audit.json"
      - "data/shared/standards/preventive-services-standards/**"
      - "data/shared/standards/service-ordinance-map.json"
      - "data/services/*/ordinance37-scope.json"
      - "data/services/preventive-*/standards-scope.json"
      - "data/services/specific-preventive-welfare-equipment-sale/standards-scope.json"
      - ".github/workflows/verify-bounded-currentness-closure.yml"
      - ".github/workflows/verify-residual-ordinance37-service-slices.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Validate bounded currentness closure decision
        run: python scripts/validate_bounded_currentness_closure.py

      - name: Run bounded currentness regression tests
        run: python -m unittest tests.test_bounded_currentness_closure

      - name: Reverify existing Ordinance 37 service slices against live e-Gov
        run: |
          python scripts/verify_existing_ordinance37_service_slices.py --report /tmp/ordinance37-service-slices-live.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/ordinance37-service-slices-live.json").read_text())
          if report.get("result") != "PASS":
              raise SystemExit("live Ordinance 37 service-slice re-verification failed")
          if report.get("summary", {}).get("services_pass") != 10:
              raise SystemExit("live Ordinance 37 audited service count drifted")
          print("PASS: live Ordinance 37 bounded service slices remain exact")
          PY

      - name: Reverify residual Ordinance 37 service slices against live e-Gov
        run: |
          python scripts/verify_residual_ordinance37_service_slices.py --report /tmp/ordinance37-residual-live.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/ordinance37-residual-live.json").read_text())
          if report.get("result") != "PASS":
              raise SystemExit("live residual Ordinance 37 service-slice re-verification failed")
          summary = report.get("summary", {})
          if summary.get("services_pass") != 2 or summary.get("discrepancies") != 0:
              raise SystemExit(f"live residual Ordinance 37 evidence drifted: {summary}")
          print("PASS: live residual Ordinance 37 service slices remain exact (2/2)")
          PY

      - name: Reparse shared standards from live e-Gov
        run: python scripts/verify_shared_standards_independent.py --report /tmp/shared-standards-independent-live.json

      - name: Recheck shared standards source freshness
        run: python scripts/verify_shared_standards_source_freshness.py --report /tmp/shared-standards-freshness-live.json

      - name: Confirm publication-readiness projection impact without writeback
        run: python scripts/validate_public_value_currentness_impact.py

      - name: Reject Worker B edits to global generated and runtime publication artifacts
        if: github.event_name == 'pull_request' && !startsWith(github.event.pull_request.title, '[Worker E]')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          for path in \
            data/database-coverage-matrix.generated.json \
            docs/database-coverage-summary.generated.md \
            data/publication-requirement-scoping.json \
            data/publication-readiness.generated.json \
            data/bounded-publication-allowlist.generated.json
          do
            if printf '%s\n' "$changed" | grep -Fxq "$path"; then
              echo "Worker B must not edit generated/readiness/runtime publication artifact: $path" >&2
              exit 1
            fi
          done
