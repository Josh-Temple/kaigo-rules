name: Verify Kaigo Ops public discovery production E

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-kaigo-ops-public-discovery-e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Install Kaigo Ops dependencies
        working-directory: ops-site
        run: npm ci --no-audit --no-fund

      - name: Verify Kaigo Ops production routes and journeys
        working-directory: ops-site
        run: npm run verify:routes -- https://ops-site-pi.vercel.app

      - name: Verify public metadata, discovery endpoints, and Rules bridge
        shell: bash
        run: |
          node <<'EOF'
          const checks = async () => {
            const ops = 'https://ops-site-pi.vercel.app';
            const issues = [
              '/issues/information-search',
              '/issues/documentation',
              '/issues/training-handover',
              '/issues/communication-collaboration',
              '/issues/productivity-utilization',
            ];

            for (const route of ['/', ...issues, '/robots.txt', '/sitemap.xml', '/_vercel/insights/script.js']) {
              const res = await fetch(ops + route, { redirect: 'follow' });
              if (!res.ok) throw new Error(route + ': HTTP ' + res.status);
              const text = await res.text();
              if (issues.includes(route)) {
                const canonical = '<link rel="canonical" href="' + ops + route + '"';
                if (!text.includes(canonical)) throw new Error(route + ': canonical missing');
                if (!text.includes('property="og:title"')) throw new Error(route + ': og:title missing');
              }
            }

            const rulesUrl = 'https://kaigo-rules.vercel.app/databases/search?q=' + encodeURIComponent('記録');
            const rules = await fetch(rulesUrl, { redirect: 'follow' });
            if (!rules.ok) throw new Error('Rules search: HTTP ' + rules.status);
            const html = await rules.text();
            const required = [
              '制度上の要件を確認した後、業務の見直しへ',
              'https://ops-site-pi.vercel.app/issues/information-search',
              'https://ops-site-pi.vercel.app/issues/documentation',
              '介護業務改善では制度適合を確定しません',
            ];
            for (const value of required) {
              if (!html.includes(value)) throw new Error('Rules bridge missing: ' + value);
            }
            for (const value of [
              'https://ops-site-pi.vercel.app/issues/training-handover',
              'https://ops-site-pi.vercel.app/issues/communication-collaboration',
              'https://ops-site-pi.vercel.app/issues/productivity-utilization',
            ]) {
              if (html.includes(value)) throw new Error('Rules bridge unexpectedly expanded: ' + value);
            }
            console.log('PASS production metadata/discovery/Rules bridge');
          };
          checks().catch((error) => { console.error(error); process.exit(1); });
          EOF

      - name: Install Chromium for 390px verification
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify 390px production journeys
        shell: bash
        run: |
          cat > verify-public-discovery-mobile.tmp.mjs <<'EOF'
          import { chromium } from 'playwright';

          const ops = 'https://ops-site-pi.vercel.app';
          const routes = [
            '/',
            '/issues/information-search',
            '/issues/documentation',
            '/issues/training-handover',
            '/issues/communication-collaboration',
            '/issues/productivity-utilization',
            '/tools/information-inventory',
            '/tools/documentation-review',
            '/tools/training-handover-inventory',
            '/tools/communication-review',
            '/tools/work-time-review',
          ];

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });

          for (const route of routes) {
            const response = await page.goto(ops + route, { waitUntil: 'networkidle' });
            if (!response || !response.ok()) throw new Error(route + ': HTTP ' + (response?.status() ?? 'no response'));
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
            if (overflow > 2) throw new Error(route + ': horizontal overflow ' + overflow + 'px at 390px');
            if (!(await page.locator('h1').count())) throw new Error(route + ': no h1');
            console.log('PASS mobile', route);
          }

          const pairs = [
            ['/issues/information-search', '/tools/information-inventory'],
            ['/issues/documentation', '/tools/documentation-review'],
            ['/issues/training-handover', '/tools/training-handover-inventory'],
            ['/issues/communication-collaboration', '/tools/communication-review'],
            ['/issues/productivity-utilization', '/tools/work-time-review'],
          ];
          for (const [issue, tool] of pairs) {
            await page.goto(ops + issue, { waitUntil: 'networkidle' });
            if (!(await page.locator(`a[href="${tool}"]`).count())) throw new Error(issue + ': missing tool link');
            if (!(await page.locator('a[href*="kaigo-rules.vercel.app/databases/search"]').count())) throw new Error(issue + ': missing Rules bridge');
            if (!(await page.getByText('GitHub Issuesでフィードバックする').count())) throw new Error(issue + ': missing feedback path');
          }

          const rulesUrl = 'https://kaigo-rules.vercel.app/databases/search?q=' + encodeURIComponent('記録');
          const rulesResponse = await page.goto(rulesUrl, { waitUntil: 'networkidle' });
          if (!rulesResponse || !rulesResponse.ok()) throw new Error('Rules search HTTP failure');
          const rulesOverflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
          if (rulesOverflow > 2) throw new Error('Rules search horizontal overflow ' + rulesOverflow + 'px at 390px');
          if (!(await page.getByRole('heading', { name: '制度上の要件を確認した後、業務の見直しへ' }).count())) {
            throw new Error('Rules contextual entry heading missing');
          }
          if (!(await page.locator('a[href="https://ops-site-pi.vercel.app/issues/information-search"]').count())) {
            throw new Error('Rules -> information-search link missing');
          }
          if (!(await page.locator('a[href="https://ops-site-pi.vercel.app/issues/documentation"]').count())) {
            throw new Error('Rules -> documentation link missing');
          }
          if (!(await page.getByText('介護業務改善では制度適合を確定しません').count())) {
            throw new Error('Rules regulatory boundary missing');
          }

          console.log('PASS Rules -> Ops mobile contextual entry');
          await browser.close();
          EOF
          node verify-public-discovery-mobile.tmp.mjs
          rm -f verify-public-discovery-mobile.tmp.mjs
