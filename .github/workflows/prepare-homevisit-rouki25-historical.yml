name: Prepare homevisit Rouki 25 historical ingestion

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "data/services/homevisit/rouki25-scope.json"
      - "scripts/import_homevisit_rouki25_historical.py"
      - "scripts/verify_homevisit_rouki25_historical_independent.py"
      - "tests/test_homevisit_rouki25_ingestion.py"
      - ".github/workflows/prepare-homevisit-rouki25-historical.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Build bounded historical dataset from official MHLW HTML
        run: python scripts/import_homevisit_rouki25_historical.py
      - name: Independently verify generated text against official MHLW HTML
        run: |
          python scripts/verify_homevisit_rouki25_historical_independent.py \
            --report homevisit-rouki25-independent-report.json
      - name: Emit generated dataset for review
        shell: bash
        run: |
          echo "HOMEVISIT_ROUKI25_DATASET_BEGIN"
          cat data/services/homevisit/rouki25-historical.generated.json
          echo "HOMEVISIT_ROUKI25_DATASET_END"
      - name: Upload generated evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: homevisit-rouki25-historical-ingestion
          path: |
            data/services/homevisit/rouki25-historical.generated.json
            homevisit-rouki25-independent-report.json
          if-no-files-found: error
