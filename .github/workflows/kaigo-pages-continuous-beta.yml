name: Kaigo Rules automatic noindex beta updates
# Pull requests only validate. After merge, an explicit beta-mode file
# permits publishing a visibly labeled, noindex beta from that main commit.
# A separate owner-controlled Actions variable KAIGO_PAGES_BETA_APPROVED=true
# is also required; the file alone must not enable publishing on unprotected main.
on:
  pull_request:
    paths:
      - ".github/workflows/kaigo-pages-continuous-beta.yml"
      - ".github/pages-beta-mode.txt"
      - "app/**"
      - "components/**"
      - "data/**"
      - "lib/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/kaigo-pages-continuous-beta.yml"
      - ".github/pages-beta-mode.txt"
      - "app/**"
      - "components/**"
      - "data/**"
      - "lib/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

# Obsolete PR checks are cancelled; main Pages deployments remain serialized.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('kaigo-pages-beta-pr-{0}', github.event.pull_request.number) || 'kaigo-rules-pages-publication' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast feedback on every candidate change. Full legal/site rebuilds are
  # performed on accepted main commits and before independent release approval.
  verify:
    name: PR safety unit tests (no full site build)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate beta warnings, link handling and source compilation
        run: |
          set -euo pipefail
          python -m unittest tests/test_github_pages_actions_safety.py tests/test_github_pages_beta.py tests/test_github_pages_legislation_pilot.py tests/test_github_pages_migration_readiness.py tests/test_github_pages_scope_gate.py tests/test_github_pages_reviewed_scope.py tests/test_github_pages_reviewed_candidate_audit.py tests/test_github_pages_signed_scope_boundary.py tests/test_github_pages_handbook_pilot.py tests/test_github_pages_internal_navigation_pilot.py
          python -m py_compile scripts/build_github_pages_integrated_pilot.py scripts/prepare_github_pages_beta.py scripts/audit_github_pages_migration_readiness.py scripts/build_github_pages_reviewed_scope.py scripts/build_github_pages_scoped_candidate.py scripts/audit_github_pages_scope_gate.py scripts/audit_github_pages_reviewed_candidate.py
          node --test tests/github-pages-static-history.test.mjs tests/github-pages-static-search-more.test.mjs

  preflight:
    # Job-level guard: when the owner has not enabled the repository variable,
    # no runner is allocated for routine main changes. Mode file is checked
    # independently inside this job (two explicit opt-ins).
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.KAIGO_PAGES_BETA_APPROVED == 'true' && vars.KAIGO_REVIEWED_SCOPE_DISTRIBUTION_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      enabled: ${{ steps.mode.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require explicit beta mode or disable automatic publication
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e .github/pages-beta-mode.txt ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [[ "$(cat .github/pages-beta-mode.txt)" == "beta" ]]; then
            # An independent, exact-byte scope receipt is mandatory BEFORE build.
            # Absent by default: skip costly generation and keep Pages unchanged.
            if [[ -s .github/pages-beta-approved-scope.json ]]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
            else
              echo "enabled=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::error::Unexpected beta mode; only beta or absent is permitted"
            exit 1
          fi

  package:
    name: Independently validate and package merge-eligible beta
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.preflight.outputs.enabled == 'true' && vars.KAIGO_REVIEWED_SCOPE_DISTRIBUTION_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require authenticated ID-scope digest BEFORE any generation
        env:
          REVIEWED_SCOPE_DIGEST: ${{ secrets.KAIGO_BETA_REVIEWED_SCOPE_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REVIEWED_SCOPE_DIGEST"
          test -s .github/pages-beta-approved-scope.json
          echo "$REVIEWED_SCOPE_DIGEST" | grep -Eq '^[0-9a-f]{64}$'
          test "$(sha256sum .github/pages-beta-approved-scope.json | cut -d' ' -f1)" = "$REVIEWED_SCOPE_DIGEST"
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('.github/pages-beta-approved-scope.json').read_text(encoding='utf-8'))
          if (m.get('schema')!='kaigo-reviewed-scope-v1'
              or m.get('purpose')!='PRIVATE_ACCEPTANCE_ONLY'
              or not isinstance(m.get('approvals'),list)
              or not m['approvals']):
              raise SystemExit('HOLD: missing independently reviewed record IDs')
          PY
      - name: Signed, scope-bound preflight and generation (B; no fallback)
        env:
          SOURCE_SHA: ${{ github.sha }}
          TARGET_MONTH: ${{ vars.KAIGO_SCOPE_TARGET_MONTH }}
          SERVICE_ID: ${{ vars.KAIGO_SCOPE_SERVICE_ID }}
          QA_SERVICE_CODE: ${{ vars.KAIGO_SCOPE_QA_SERVICE_CODE }}
          TRUSTED_KEY_SHA256: ${{ secrets.KAIGO_REVIEWER_SIGNING_KEY_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TARGET_MONTH" && test -n "$SERVICE_ID" && test -n "$QA_SERVICE_CODE"
          test -n "$TRUSTED_KEY_SHA256"
          for name in kaigo-verified-legal-records.json kaigo-independent-record-receipt.json kaigo-independent-record-signature.bin kaigo-reviewer-trusted.pub; do
            test -s "$RUNNER_TEMP/$name"
          done
          args=(
            --source-sha "$SOURCE_SHA"
            --target-month "$TARGET_MONTH"
            --service-id "$SERVICE_ID"
            --qa-service-code "$QA_SERVICE_CODE"
            --approvals .github/pages-beta-approved-scope.json
            --legal "$RUNNER_TEMP/kaigo-verified-legal-records.json"
            --qa data/qa-corpus.json --qa-meta data/qa-corpus-meta.json
            --receipt "$RUNNER_TEMP/kaigo-independent-record-receipt.json"
            --signature "$RUNNER_TEMP/kaigo-independent-record-signature.bin"
            --trusted-key "$RUNNER_TEMP/kaigo-reviewer-trusted.pub"
            --trusted-key-sha256 "$TRUSTED_KEY_SHA256"
          )
          python scripts/build_github_pages_scoped_candidate.py "${args[@]}" --preflight-only
          python scripts/build_github_pages_scoped_candidate.py "${args[@]}" \
            --private-output "$RUNNER_TEMP/kaigo-scoped-beta"
      - name: Final marker and independent final-byte check (fails private-only builder)
        id: site
        env:
          SOURCE_SHA: ${{ github.sha }}
          TRUSTED_RECEIPT_SHA256: ${{ secrets.KAIGO_BETA_DISTRIBUTION_RECEIPT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/kaigo-independent-beta-receipt.json"
          touch "$RUNNER_TEMP/kaigo-scoped-beta/.nojekyll"
          python scripts/audit_github_pages_reviewed_candidate.py \
            "$RUNNER_TEMP/kaigo-scoped-beta" --source-sha "$SOURCE_SHA" \
            --manifest .github/pages-beta-approved-scope.json \
            --receipt "$RUNNER_TEMP/kaigo-independent-beta-receipt.json" \
            --trusted-receipt-sha256 "$TRUSTED_RECEIPT_SHA256" --mode beta
          # B's current builder is PRIVATE_ACCEPTANCE_ONLY, so the audit
          # deliberately never reaches this output pending another review Wave.
          echo "path=$RUNNER_TEMP/kaigo-scoped-beta" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
        if: github.event_name == 'workflow_dispatch'
      - name: Upload approved public-beta artifact
        uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          path: ${{ steps.site.outputs.path }}

  deploy:
    name: Deploy visibly labeled noindex beta
    needs: [preflight, package]
    if: github.event_name == 'workflow_dispatch' && needs.preflight.outputs.enabled == 'true' && vars.KAIGO_REVIEWED_SCOPE_DISTRIBUTION_READY == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - name: Deploy generated beta
        uses: actions/deploy-pages@v4
        id: deploy
