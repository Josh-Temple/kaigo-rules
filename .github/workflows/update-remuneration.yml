name: Update current day-service remuneration text

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-remuneration.yml"
      - "scripts/import_current_remuneration.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install HTML parser
        run: python -m pip install beautifulsoup4==4.13.4
      - name: Import current MHLW remuneration text
        run: python scripts/import_current_remuneration.py
      - name: Independently verify remuneration sources
        run: python scripts/verify_remuneration_independent.py
      - name: Validate data references
        run: node scripts/validate-data.mjs
      - name: Detect changes
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- data/remuneration-current-text.json data/remuneration-current-text-meta.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push review branch
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          BRANCH="automation/remuneration-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add data/remuneration-current-text.json data/remuneration-current-text-meta.json
          git commit -m "data: refresh current day-service remuneration text"
          git push origin "$BRANCH"
