name: Kaigo Rules GitHub Pages release (independent approval required)

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: "Exact 40-character main commit SHA approved by independent reviewer"
        required: true
        type: string
      acceptance_commit:
        description: "40-character SHA of separate reviewed approval evidence commit (not in main)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kaigo-rules-pages-publication
  cancel-in-progress: false

jobs:
  package:
    name: Independently gated static publication package
    if: github.ref == 'refs/heads/main' && vars.KAIGO_REVIEWED_SCOPE_DISTRIBUTION_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require approval tied to exactly this main commit
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          test "$APPROVED_SHA" = "$MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
      - name: Checkout separately approved acceptance evidence
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.acceptance_commit }}
          path: release-acceptance
          persist-credentials: false
      - name: Verify exact acceptance evidence revision
        env:
          ACCEPTANCE_SHA: ${{ inputs.acceptance_commit }}
        run: |
          [[ "$ACCEPTANCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git -C release-acceptance rev-parse HEAD)" = "$ACCEPTANCE_SHA"
          test -f release-acceptance/docs/pages-release-acceptance.json
          # A separate reviewed exact-byte approval must pre-exist the expensive build.
          test -s release-acceptance/docs/pages-distribution-approval.json
          test -s release-acceptance/docs/pages-public-distribution-approval.json
          test -s release-acceptance/docs/pages-reviewed-id-approval.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run small fail-closed regression tests (before generation)
        run: |
          set -euo pipefail
          python -m unittest tests/test_github_pages_scope_gate.py tests/test_github_pages_reviewed_scope.py tests/test_github_pages_reviewed_candidate_audit.py tests/test_github_pages_actions_safety.py
      - name: Verify separately supplied record IDs, without trusting JSON words
        env:
          REVIEWED_SCOPE_DIGEST: ${{ secrets.KAIGO_RELEASE_REVIEWED_SCOPE_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REVIEWED_SCOPE_DIGEST"
          echo "$REVIEWED_SCOPE_DIGEST" | grep -Eq '^[0-9a-f]{64}$'
          test "$(sha256sum release-acceptance/docs/pages-reviewed-id-approval.json | cut -d' ' -f1)" = "$REVIEWED_SCOPE_DIGEST"
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('release-acceptance/docs/pages-reviewed-id-approval.json').read_text(encoding='utf-8'))
          if (m.get('schema')!='kaigo-reviewed-scope-v1'
              or m.get('purpose')!='PRIVATE_ACCEPTANCE_ONLY'
              or not isinstance(m.get('approvals'),list) or not m['approvals']):
              raise SystemExit('HOLD: unsupported approval scope')
          PY
      - name: Build only the reviewed-ID scope into a new runner-temporary tree
        shell: bash
        run: |
          set -euo pipefail
          # No private corpus is checked in or pulled from Actions artifacts.
          # A separately trusted, prechecked source must be provisioned first.
          test -s "$RUNNER_TEMP/kaigo-verified-legal-records.json"
          python scripts/build_github_pages_reviewed_scope.py \
            --approvals release-acceptance/docs/pages-reviewed-id-approval.json \
            --legal "$RUNNER_TEMP/kaigo-verified-legal-records.json" \
            --qa data/qa-corpus.json --qa-meta data/qa-corpus-meta.json \
            --private-output "$RUNNER_TEMP/kaigo-reviewed-public"
      - name: Audit bounded PRIVATE candidate (not a release verdict)
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python scripts/audit_github_pages_reviewed_candidate.py \
            "$RUNNER_TEMP/kaigo-reviewed-public" --source-sha "$SOURCE_SHA" \
            --manifest release-acceptance/docs/pages-reviewed-id-approval.json \
            --mode private
      - name: Finalize marker, then independently check exact upload bytes
        env:
          SOURCE_SHA: ${{ github.sha }}
          TRUSTED_RECEIPT_SHA256: ${{ secrets.KAIGO_PUBLIC_DISTRIBUTION_RECEIPT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$TRUSTED_RECEIPT_SHA256"
          touch "$RUNNER_TEMP/kaigo-reviewed-public/.nojekyll"
          python scripts/audit_github_pages_reviewed_candidate.py \
            "$RUNNER_TEMP/kaigo-reviewed-public" --source-sha "$SOURCE_SHA" \
            --manifest release-acceptance/docs/pages-reviewed-id-approval.json \
            --receipt release-acceptance/docs/pages-public-distribution-approval.json \
            --trusted-receipt-sha256 "$TRUSTED_RECEIPT_SHA256" --mode public
          # Current B output is PRIVATE_ACCEPTANCE_ONLY. This always HOLDs
          # until independent publication-ready generator/code is accepted.
      - name: Configure Pages only after all gates
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/kaigo-reviewed-public

  deploy:
    name: Publish independently approved candidate to GitHub Pages
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved artifact
        id: deployment
        uses: actions/deploy-pages@v4
