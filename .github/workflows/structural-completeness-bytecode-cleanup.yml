name: Structural completeness bytecode cleanup

on:
  push:
    branches:
      - work/structural-completeness-wave-integrator
    paths:
      - ".github/workflows/structural-completeness-bytecode-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: work/structural-completeness-wave-integrator
          fetch-depth: 0
      - name: Restore tracked bytecode to main and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git checkout origin/main -- scripts/__pycache__ tests/__pycache__
          rm .github/workflows/structural-completeness-bytecode-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Integrator: restore tracked bytecode to main state"
          git push origin HEAD:work/structural-completeness-wave-integrator
