name: Verify standards interpretation source inventories

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "data/services/*/standards-interpretation-scope.json"
      - "data/services/*/standards-interpretation-staging.json"
      - "scripts/verify_standards_interpretation_sources_independent.py"
      - ".github/workflows/verify-standards-interpretation-sources.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Re-fetch and independently inventory official sources
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/standards-interpretation-source-inventory
          rc=0
          for spec in \
            "community-dayservice:21" \
            "regular-round:21" \
            "night-homevisit:25" \
            "care-management:32" \
            "preventive-support:34"; do
            service="${spec%%:*}"
            expected="${spec##*:}"
            python scripts/verify_standards_interpretation_sources_independent.py \
              --service-id "$service" \
              --expected-items "$expected" \
              --report "/tmp/standards-interpretation-source-inventory/${service}.json" || rc=1
          done
          exit "$rc"
      - name: Upload independent source-inventory reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: standards-interpretation-source-inventory
          path: /tmp/standards-interpretation-source-inventory/*.json
          if-no-files-found: error
