name: One-time dayrehab preview production deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-dayrehab-preview-production-deploy.yml"

concurrency:
  group: one-time-dayrehab-preview-production-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Trigger kaigo-rules production deploy
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_KAIGO_RULES }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Missing secret VERCEL_DEPLOY_HOOK_KAIGO_RULES"
            exit 1
          fi
          response="$(curl --fail-with-body --silent --show-error -X POST "$DEPLOY_HOOK")"
          echo "$response" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("job",{}).get("id"), d'

      - name: Verify exact production SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE_URL: https://kaigo-rules.vercel.app
        run: |
          python scripts/verify_field_validation_production.py \
            --base-url "$BASE_URL" \
            --expected-sha "$EXPECTED_SHA" \
            --wait-seconds 600 \
            --interval-seconds 15

      - name: Run integrated black-box release gate
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE_URL: https://kaigo-rules.vercel.app
        run: |
          python scripts/run_integration_sprint_release_regression.py \
            --base-url "$BASE_URL" \
            --expected-sha "$EXPECTED_SHA"

      - name: Record kaigo-rules deploy state
        run: git push --force origin "HEAD:refs/heads/deploy-state/kaigo-rules"
