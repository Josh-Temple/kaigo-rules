name: Materialize scope wave integration

on:
  push:
    branches:
      - db/scope-wave-integrator

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Regenerate canonical projections
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_service_catalog.py
          python scripts/build_shared_standards_service_relations.py
          python scripts/build_qa_service_relations.py
          python scripts/build_relation_verification_queue.py
          python scripts/build_relation_human_review_packet.py
          python scripts/build_relation_human_review_evidence_pack.py
          python scripts/build_verification_registry.py
          python scripts/build_database_coverage_matrix.py
          python scripts/build_product_value_snapshot.py
          python scripts/build_question_context_packages.py
      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Regenerate scope wave projections"
          git push origin HEAD:db/scope-wave-integrator
