name: Update day-service unit price

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-unit-price.yml"
      - "scripts/import_unit_price.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install HTML parser
        run: python -m pip install beautifulsoup4==4.13.4
      - name: Import current unit price
        run: python scripts/import_unit_price.py
      - name: Independently verify imported unit price
        run: python scripts/verify_unit_price_independent.py
      - name: Validate data
        run: node scripts/validate-data.mjs
      - name: Detect changes
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- data/unit-price-dayservice.json data/unit-price-dayservice-meta.json data/unit-price-region-assignments.json data/unit-price-region-assignments-meta.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push review branch
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          BRANCH="automation/unit-price-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add data/unit-price-dayservice.json data/unit-price-dayservice-meta.json data/unit-price-region-assignments.json data/unit-price-region-assignments-meta.json
          git commit -m "data: refresh day-service unit price"
          git push origin "$BRANCH"
          echo "Generated review branch: $BRANCH" >> "$GITHUB_STEP_SUMMARY"
