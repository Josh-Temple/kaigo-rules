name: Database completion assurance integrator

on:
  push:
    branches:
      - "work/database-completion-assurance-wave-integrator"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: database-completion-assurance-integrator
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/database-completion-assurance-wave-integrator
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Regenerate global derived artifacts once
        run: |
          python scripts/build_service_catalog.py
          python scripts/build_relation_verification_queue.py
          python scripts/build_relation_human_review_packet.py
          python scripts/build_relation_human_review_evidence_pack.py
          python scripts/build_verification_registry.py
          python scripts/build_database_coverage_matrix.py
          python scripts/build_product_value_snapshot.py

      - name: Full validation and production build
        run: |
          python scripts/verify_dayrehab_fee_layers_independent.py --report /tmp/dayrehab-fee-layer-independent-report.json
          npm run build
          python -m py_compile scripts/verify_field_validation_production.py

      - name: Commit regenerated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Integrator: regenerate global assurance artifacts"
          git push origin HEAD:work/database-completion-assurance-wave-integrator
