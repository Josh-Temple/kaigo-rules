name: Assurance closure integrator regeneration

on:
  push:
    branches:
      - work/assurance-closure-wave-integrator-v2

permissions:
  contents: write

concurrency:
  group: assurance-closure-integrator-regeneration
  cancel-in-progress: false

jobs:
  regenerate-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Regenerate canonical derived artifacts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_careact_service_indexes.py
          python scripts/build_service_catalog.py
          python scripts/build_homevisit_careact_index.py
          python scripts/build_homevisit_ordinance37_index.py
          python scripts/build_dayrehab_article119_relations.py
          python scripts/build_dayrehab_ordinance37_index.py
          python scripts/build_notice_review_packet.py
          python scripts/build_notice_rouki25_audit_report.py
          python scripts/build_delegated_remuneration_shared_corpus.py
          python scripts/build_remuneration_source_link_derived_audit.py
          python scripts/build_notice_ordinance_explicit_reference_derived_audit.py
          python scripts/build_careact_service_identity_derived_audit.py
          python scripts/build_relation_verification_queue.py
          python scripts/build_relation_human_review_packet.py
          python scripts/build_relation_human_review_evidence_pack.py
          python scripts/build_verification_registry.py
          python scripts/build_database_coverage_matrix.py
          python scripts/build_product_value_snapshot.py
          python scripts/build_question_context_packages.py
          python scripts/build_shared_standards_service_relations.py
          python scripts/build_qa_service_relations.py
          echo "Generated changes:"
          git status --short
      - name: Validate shared currentness assurance
        run: python scripts/validate_shared_currentness_assurance.py
      - name: Validate standards interpretation assurance closure
        run: python scripts/validate_standards_interpretation_assurance_closure.py
      - name: Full repository validation and build
        run: npm run build
      - name: Commit exact regenerated outputs and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/assurance-closure-integrator-regeneration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[assurance-closure-generated] Regenerate global assurance artifacts"
          git push origin HEAD:work/assurance-closure-wave-integrator
